<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" font-family="Helvetica, Arial, sans-serif">
  <title>App Mesh architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1160" height="740" rx="16" fill="#f7f9fb"/>

  <!-- ======================= Left: who connects ======================= -->
  <!-- Users -->
  <g stroke="#33414e" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="56" cy="116" r="5.5" fill="white"/>
    <path d="M56,121.5 V132 M47,126 H65 M56,132 L50,142 M56,132 L62,142"/>
  </g>
  <text x="74" y="122" font-size="14.5" font-weight="bold" fill="#33414e">Users</text>
  <text x="74" y="137" font-size="10.5" fill="#66727d">admins · tenant users</text>

  <rect x="30" y="156" width="140" height="50" rx="25" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="100" y="187" font-size="15" text-anchor="middle" fill="#111">CLI (appm)</text>

  <rect x="30" y="222" width="140" height="50" rx="25" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="100" y="253" font-size="15" text-anchor="middle" fill="#111">Web UI</text>

  <rect x="30" y="288" width="140" height="50" rx="25" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="100" y="319" font-size="15" text-anchor="middle" fill="#111">Your code</text>

  <!-- SDK -->
  <rect x="220" y="166" width="150" height="162" rx="10" fill="#cde6b8" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="214" font-size="16" font-weight="bold" text-anchor="middle" fill="#22331a">SDK</text>
  <text x="295" y="240" font-size="11.5" text-anchor="middle" fill="#3c5230">Go · Java · JavaScript</text>
  <text x="295" y="259" font-size="11.5" text-anchor="middle" fill="#3c5230">Python · Rust</text>
  <text x="295" y="288" font-size="11" font-style="italic" text-anchor="middle" fill="#3c5230">REST · TCP · WebSocket</text>

  <!-- AI agents -->
  <g stroke="#33414e" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M56,381 V376"/>
    <circle cx="56" cy="374" r="1.8" fill="#33414e" stroke="none"/>
    <rect x="46" y="381" width="20" height="15" rx="3.5" fill="white"/>
    <circle cx="52" cy="388" r="1.7" fill="#33414e" stroke="none"/>
    <circle cx="60" cy="388" r="1.7" fill="#33414e" stroke="none"/>
    <path d="M52,392.5 H60 M43,387.5 H46 M66,387.5 H69"/>
  </g>
  <text x="74" y="381" font-size="14.5" font-weight="bold" fill="#33414e">AI agents</text>
  <text x="74" y="396" font-size="10.5" fill="#66727d">Claude Code · Codex</text>

  <rect x="30" y="410" width="140" height="50" rx="25" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="100" y="441" font-size="15" text-anchor="middle" fill="#111">MCP client</text>

  <!-- MCP server -->
  <rect x="220" y="405" width="150" height="60" rx="10" fill="#cde6b8" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="429" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#22331a">MCP server</text>
  <text x="295" y="447" font-size="10.5" text-anchor="middle" fill="#3c5230">:6070 · OAuth 2.1 · RBAC</text>

  <!-- ======================= Center: App Mesh Node ======================= -->
  <rect x="410" y="30" width="520" height="546" rx="14" fill="white" stroke="#6a8f5a" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="436" y="64" font-size="17" font-weight="bold" fill="#4a6b3d">App Mesh Node</text>
  <text x="436" y="84" font-size="12.5" fill="#7a8a70">Linux / Windows / macOS · Docker or native process</text>

  <!-- Daemon -->
  <rect x="442" y="110" width="152" height="440" rx="10" fill="#cde6b8" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="518" y="243" font-size="17" font-weight="bold" text-anchor="middle" fill="#22331a">App Mesh</text>
  <text x="518" y="265" font-size="17" font-weight="bold" text-anchor="middle" fill="#22331a">Daemon</text>
  <text x="518" y="287" font-size="11" font-style="italic" text-anchor="middle" fill="#3c5230">run · schedule · control</text>
  <text x="518" y="325" font-size="11.5" text-anchor="middle" fill="#3c5230">REST :6060</text>
  <text x="518" y="343" font-size="11.5" text-anchor="middle" fill="#3c5230">TCP :6062</text>
  <text x="518" y="361" font-size="11.5" text-anchor="middle" fill="#3c5230">WSS :6063</text>
  <text x="518" y="379" font-size="11.5" text-anchor="middle" fill="#3c5230">Metrics :6061</text>
  <text x="518" y="409" font-size="11" font-style="italic" text-anchor="middle" fill="#3c5230">OIDC / SSO · RBAC</text>
  <text x="518" y="427" font-size="11" font-style="italic" text-anchor="middle" fill="#3c5230">tenant isolation</text>

  <!-- Hosting -->
  <rect x="634" y="112" width="66" height="20" rx="10" fill="#6a8f5a"/>
  <text x="667" y="126" font-size="11.5" font-weight="bold" text-anchor="middle" fill="white">Hosting</text>
  <text x="708" y="126" font-size="10.5" font-style="italic" fill="#7a8a70">declare once, keep it running</text>

  <rect x="634" y="146" width="264" height="94" rx="10" fill="#eef4f8" stroke="#7a9aab" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="766" y="166" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#33414e">User Alice's apps</text>
  <rect x="665" y="176" width="58" height="46" rx="8" fill="#1d63ed"/>
  <g transform="translate(682,189.5) scale(1.4)" stroke="white" stroke-width="1.4" fill="none">
    <rect x="4" y="7" width="3.4" height="3.4" fill="white" stroke="none"/>
    <rect x="8.6" y="7" width="3.4" height="3.4" fill="white" stroke="none"/>
    <rect x="13.2" y="7" width="3.4" height="3.4" fill="white" stroke="none"/>
    <rect x="8.6" y="2.4" width="3.4" height="3.4" fill="white" stroke="none"/>
    <path d="M0 14.5c1.8 1.3 3.6 1.3 5.4 0 1.8 1.3 3.6 1.3 5.4 0 1.8 1.3 3.6 1.3 5.4 0"/>
  </g>
  <text x="694" y="236" font-size="10.5" text-anchor="middle" fill="#33414e">Docker</text>
  <rect x="737" y="176" width="58" height="46" rx="8" fill="#d82c20"/>
  <g transform="translate(753,186)" fill="none" stroke="white" stroke-width="1.5">
    <ellipse cx="15" cy="7" rx="13" ry="4.5"/>
    <path d="M2 7 v8 a13 4.5 0 0 0 26 0 v-8"/>
    <path d="M2 15 v8 a13 4.5 0 0 0 26 0 v-8"/>
  </g>
  <text x="766" y="236" font-size="10.5" text-anchor="middle" fill="#33414e">Redis</text>
  <rect x="809" y="176" width="58" height="46" rx="8" fill="#33414e"/>
  <text x="838" y="206" font-size="15" font-weight="bold" text-anchor="middle" fill="white" font-family="Menlo, monospace">&gt;_</text>
  <text x="838" y="236" font-size="10.5" text-anchor="middle" fill="#33414e">Shell</text>

  <rect x="634" y="252" width="264" height="94" rx="10" fill="#eef4f8" stroke="#7a9aab" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="766" y="272" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#33414e">User Bob's apps</text>
  <rect x="665" y="282" width="58" height="46" rx="8" fill="#009639"/>
  <path d="M694 290 L712 300.5 L712 315.5 L694 326 L676 315.5 L676 300.5 Z" fill="white"/>
  <text x="694" y="312" font-size="15" font-weight="bold" text-anchor="middle" fill="#009639">N</text>
  <text x="694" y="342" font-size="10.5" text-anchor="middle" fill="#33414e">Nginx</text>
  <rect x="737" y="282" width="58" height="46" rx="8" fill="#5b6ee1"/>
  <text x="766" y="312" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-family="Menlo, monospace">{ }</text>
  <text x="766" y="342" font-size="10.5" text-anchor="middle" fill="#33414e">App</text>
  <rect x="809" y="282" width="58" height="46" rx="8" fill="#e8890c"/>
  <circle cx="838" cy="305" r="13" fill="none" stroke="white" stroke-width="2"/>
  <path d="M838 297 v8 l6 4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <text x="838" y="342" font-size="10.5" text-anchor="middle" fill="#33414e">Cron job</text>

  <text x="634" y="364" font-size="10.5" font-style="italic" fill="#7a8a70">lifecycle · scheduling · health check · limits</text>

  <!-- Computing -->
  <rect x="634" y="412" width="80" height="20" rx="10" fill="#1f9488"/>
  <text x="674" y="426" font-size="11.5" font-weight="bold" text-anchor="middle" fill="white">Computing</text>
  <text x="722" y="426" font-size="10.5" font-style="italic" fill="#7a8a70">submit work, get results back</text>

  <rect x="634" y="446" width="264" height="104" rx="10" fill="#e9f6f3" stroke="#7fbfb5" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="647" y="458" width="52" height="46" rx="8" fill="#1f9488"/>
  <text x="673" y="487" font-size="15" font-weight="bold" text-anchor="middle" fill="white" font-family="Menlo, monospace">&gt;_</text>
  <rect x="709" y="458" width="52" height="46" rx="8" fill="#1f9488"/>
  <rect x="726" y="473" width="18" height="14" rx="2" fill="none" stroke="white" stroke-width="1.6"/>
  <path d="M726,475 L735,482 L744,475" fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="771" y="458" width="52" height="46" rx="8" fill="#1f9488"/>
  <path d="M792,475 L802,480 M792,487 L802,482" stroke="white" stroke-width="1.6"/>
  <circle cx="789" cy="474" r="3" fill="white"/>
  <circle cx="789" cy="488" r="3" fill="white"/>
  <circle cx="805" cy="481" r="3.2" fill="white"/>
  <rect x="833" y="458" width="52" height="46" rx="8" fill="#1f9488"/>
  <path d="M855,473 C856.2,479.5 858.5,481.8 865,483 C858.5,484.2 856.2,486.5 855,493 C853.8,486.5 851.5,484.2 845,483 C851.5,481.8 853.8,479.5 855,473 Z" fill="white"/>
  <path d="M866,461 C866.6,463.8 867.7,464.9 870.5,465.5 C867.7,466.1 866.6,467.2 866,470 C865.4,467.2 864.3,466.1 861.5,465.5 C864.3,464.9 865.4,463.8 866,461 Z" fill="white"/>
  <text x="673" y="518" font-size="10.5" text-anchor="middle" fill="#33414e">Run</text>
  <text x="735" y="518" font-size="10.5" text-anchor="middle" fill="#33414e">Task</text>
  <text x="797" y="518" font-size="10.5" text-anchor="middle" fill="#33414e">Workflow</text>
  <text x="859" y="518" font-size="10.5" text-anchor="middle" fill="#33414e">AI agent</text>
  <text x="766" y="538" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5f726f">sync or async · streaming · fan out across nodes</text>

  <!-- ======================= Right: Observability ======================= -->
  <rect x="970" y="30" width="160" height="546" rx="14" fill="white" stroke="#7a9aab" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1050" y="64" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#33414e">Observability</text>

  <rect x="982" y="92" width="136" height="82" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <circle cx="1006" cy="124" r="14" fill="#e6522c"/>
  <path d="M1006 115 v9 M1001 132 a7 7 0 0 0 10 0" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1062" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Prometheus</text>
  <text x="1062" y="137" font-size="10.5" text-anchor="middle" fill="#555">scrape</text>
  <text x="1050" y="162" font-size="10.5" text-anchor="middle" fill="#555">metrics :6061</text>

  <rect x="982" y="206" width="136" height="82" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <circle cx="1006" cy="238" r="14" fill="none" stroke="#f46800" stroke-width="2.4"/>
  <circle cx="1006" cy="238" r="8" fill="none" stroke="#f2b02e" stroke-width="2.2"/>
  <circle cx="1006" cy="238" r="2.4" fill="#f46800"/>
  <text x="1062" y="234" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Grafana</text>
  <text x="1062" y="251" font-size="10.5" text-anchor="middle" fill="#555">dashboards</text>
  <text x="1050" y="276" font-size="10.5" text-anchor="middle" fill="#555">alerting</text>

  <rect x="982" y="320" width="136" height="82" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <path d="M998 336 h16 M998 344 h20 M998 352 h13 M998 360 h18" stroke="#e5b80b" stroke-width="3" stroke-linecap="round"/>
  <text x="1062" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Loki</text>
  <text x="1062" y="367" font-size="10.5" text-anchor="middle" fill="#555">log query</text>
  <text x="1050" y="390" font-size="10.5" text-anchor="middle" fill="#555">app stdout / log files</text>

  <rect x="982" y="434" width="136" height="82" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <path d="M996 467 h12 M996 474 h16 M996 481 h10" stroke="#33414e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M1014 477 l5 4 -5 4" stroke="#33414e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="1062" y="471" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Promtail</text>
  <text x="1062" y="488" font-size="10.5" text-anchor="middle" fill="#555">log shipping</text>
  <text x="1050" y="510" font-size="10.5" text-anchor="middle" fill="#555">reads app log files</text>

  <!-- ======================= Bottom: more nodes ======================= -->
  <rect x="440" y="642" width="180" height="80" rx="10" fill="#e4eee0" stroke="#6a8f5a" stroke-width="1.6"/>
  <rect x="434" y="636" width="180" height="80" rx="10" fill="#f0f6ea" stroke="#6a8f5a" stroke-width="1.6"/>
  <rect x="428" y="630" width="180" height="80" rx="10" fill="white" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="518" y="658" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#22331a">Remote App Mesh</text>
  <text x="518" y="675" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#22331a">Nodes</text>
  <text x="518" y="696" font-size="10.5" font-style="italic" text-anchor="middle" fill="#6b7a6a">one cluster · forward to any node</text>

  <!-- ======================= Arrows ======================= -->
  <g stroke="#444" stroke-width="1.8" fill="none">
    <!-- clients -> SDK -> daemon -->
    <path d="M174,181 H216" marker-end="url(#arr)"/>
    <path d="M174,247 H216" marker-end="url(#arr)"/>
    <path d="M174,313 H216" marker-end="url(#arr)"/>
    <path d="M374,247 H440" marker-end="url(#arr)"/>
    <!-- MCP client -> MCP server -> daemon -->
    <path d="M174,435 H216" marker-end="url(#arr)"/>
    <path d="M374,435 H440" marker-end="url(#arr)"/>
    <!-- daemon hosts apps and runs work -->
    <path d="M595,193 H630" marker-end="url(#arr)"/>
    <path d="M595,299 H630" marker-end="url(#arr)"/>
    <path d="M595,498 H630" marker-end="url(#arr)"/>
    <!-- prometheus scrapes metrics -->
    <path d="M970,133 H950 V386 H596" marker-end="url(#arr)"/>
    <!-- app log files -> promtail -->
    <path d="M930,475 H966" marker-end="url(#arr)"/>
    <!-- grafana / promtail queries and pushes -->
    <path d="M1050,206 V177" marker-end="url(#arr)"/>
    <path d="M1050,288 V317" marker-end="url(#arr)"/>
    <path d="M1050,434 V405" marker-end="url(#arr)"/>
    <!-- forward to remote nodes -->
    <path d="M518,550 V626" marker-end="url(#arr)"/>
  </g>
  <g font-size="10.5" font-style="italic" fill="#555">
    <text x="920" y="398" text-anchor="end">scrape metrics</text>
    <text x="1058" y="195">query</text>
    <text x="1058" y="307">query</text>
    <text x="1058" y="423">push</text>
    <text x="528" y="606">forward</text>
  </g>

  <!-- R response marker: dot beside the arrow tip, italic R next to it -->
  <g fill="white" stroke="#444" stroke-width="1.4">
    <circle cx="423" cy="235" r="5"/>
    <circle cx="423" cy="423" r="5"/>
  </g>
  <g font-size="10.5" font-style="italic" fill="#333">
    <text x="431" y="239">R</text>
    <text x="431" y="427">R</text>
  </g>
</svg>
