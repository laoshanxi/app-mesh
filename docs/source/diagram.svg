<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1160" height="720" rx="16" fill="#f7f9fb"/>

  <!-- ======================= Left: Users ======================= -->
  <text x="60" y="180" font-size="16" font-weight="bold" fill="#33414e">Users</text>

  <!-- person icon -->
  <g stroke="#33414e" stroke-width="2.4" fill="none" stroke-linecap="round">
    <circle cx="110" cy="214" r="9" fill="white"/>
    <path d="M110,223 L110,254 M94,232 L126,232 M110,254 L96,282 M110,254 L124,282"/>
  </g>

  <!-- CLI / Web / MCP pills -->
  <rect x="40" y="310" width="140" height="46" rx="23" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="110" y="339" font-size="15" text-anchor="middle" fill="#111">CLI (appc)</text>

  <rect x="40" y="372" width="140" height="46" rx="23" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="110" y="401" font-size="15" text-anchor="middle" fill="#111">Web UI</text>

  <rect x="40" y="434" width="140" height="46" rx="23" fill="white" stroke="#33414e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="110" y="463" font-size="15" text-anchor="middle" fill="#111">AI Agent (MCP)</text>

  <!-- SDK / REST client -->
  <rect x="230" y="300" width="150" height="140" rx="10" fill="#cde6b8" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="358" font-size="16" font-weight="bold" text-anchor="middle" fill="#22331a">SDK</text>
  <text x="305" y="380" font-size="11.5" text-anchor="middle" fill="#3c5230">C++ / Go / Python</text>
  <text x="305" y="397" font-size="11.5" text-anchor="middle" fill="#3c5230">Rust / Java / JS</text>
  <text x="305" y="418" font-size="11.5" font-style="italic" text-anchor="middle" fill="#3c5230">REST client</text>

  <!-- ======================= Center: App Mesh Node ======================= -->
  <rect x="420" y="30" width="500" height="480" rx="14" fill="white" stroke="#6a8f5a" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="446" y="64" font-size="17" font-weight="bold" fill="#4a6b3d">App Mesh Node</text>
  <text x="446" y="84" font-size="12.5" fill="#7a8a70">Linux / Windows / macOS · Docker or native process</text>

  <!-- Daemon -->
  <rect x="452" y="110" width="190" height="330" rx="10" fill="#cde6b8" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="547" y="180" font-size="17" font-weight="bold" text-anchor="middle" fill="#22331a">App Mesh</text>
  <text x="547" y="202" font-size="17" font-weight="bold" text-anchor="middle" fill="#22331a">Daemon</text>
  <text x="547" y="230" font-size="11.5" text-anchor="middle" fill="#3c5230">REST :6060</text>
  <text x="547" y="247" font-size="11.5" text-anchor="middle" fill="#3c5230">WSS :6058</text>
  <text x="547" y="264" font-size="11.5" text-anchor="middle" fill="#3c5230">Metrics :6061</text>
  <text x="547" y="292" font-size="11.5" font-style="italic" text-anchor="middle" fill="#3c5230">OIDC security</text>

  <!-- User Alice apps -->
  <rect x="686" y="110" width="204" height="150" rx="10" fill="#eef4f8" stroke="#7a9aab" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="788" y="136" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#33414e">User Alice's apps</text>

  <!-- docker tile -->
  <g>
    <rect x="706" y="150" width="52" height="44" rx="8" fill="#1d63ed"/>
    <g transform="translate(716,166) scale(1.15)" stroke="white" stroke-width="1.4" fill="none">
      <rect x="4" y="7" width="3.4" height="3.4" fill="white" stroke="none"/>
      <rect x="8.6" y="7" width="3.4" height="3.4" fill="white" stroke="none"/>
      <rect x="13.2" y="7" width="3.4" height="3.4" fill="white" stroke="none"/>
      <rect x="8.6" y="2.4" width="3.4" height="3.4" fill="white" stroke="none"/>
      <path d="M0 14.5c1.8 1.3 3.6 1.3 5.4 0 1.8 1.3 3.6 1.3 5.4 0 1.8 1.3 3.6 1.3 5.4 0"/>
    </g>
    <text x="732" y="210" font-size="10.5" text-anchor="middle" fill="#33414e">Docker</text>
  </g>
  <!-- redis tile -->
  <g>
    <rect x="764" y="150" width="52" height="44" rx="8" fill="#d82c20"/>
    <g transform="translate(774,160)" fill="none" stroke="white" stroke-width="1.5">
      <ellipse cx="15" cy="7" rx="13" ry="4.5"/>
      <path d="M2 7 v8 a13 4.5 0 0 0 26 0 v-8"/>
      <path d="M2 15 v8 a13 4.5 0 0 0 26 0 v-8"/>
    </g>
    <text x="790" y="210" font-size="10.5" text-anchor="middle" fill="#33414e">Redis</text>
  </g>
  <!-- shell tile -->
  <g>
    <rect x="822" y="150" width="52" height="44" rx="8" fill="#33414e"/>
    <text x="848" y="179" font-size="15" font-weight="bold" text-anchor="middle" fill="white" font-family="Menlo, monospace">&gt;_</text>
    <text x="848" y="210" font-size="10.5" text-anchor="middle" fill="#33414e">Shell</text>
  </g>

  <!-- User Bob apps -->
  <rect x="686" y="290" width="204" height="150" rx="10" fill="#eef4f8" stroke="#7a9aab" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="788" y="316" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#33414e">User Bob's apps</text>

  <!-- nginx tile -->
  <g>
    <rect x="706" y="330" width="52" height="44" rx="8" fill="#009639"/>
    <path d="M732 337 L750 347.5 L750 362.5 L732 373 L714 362.5 L714 347.5 Z" fill="white"/>
    <text x="732" y="361" font-size="15" font-weight="bold" text-anchor="middle" fill="#009639">N</text>
    <text x="732" y="390" font-size="10.5" text-anchor="middle" fill="#33414e">Nginx</text>
  </g>
  <!-- app tile -->
  <g>
    <rect x="764" y="330" width="52" height="44" rx="8" fill="#5b6ee1"/>
    <text x="790" y="359" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-family="Menlo, monospace">{ }</text>
    <text x="790" y="390" font-size="10.5" text-anchor="middle" fill="#33414e">App</text>
  </g>
  <!-- cron tile -->
  <g>
    <rect x="822" y="330" width="52" height="44" rx="8" fill="#e8890c"/>
    <circle cx="848" cy="352" r="13" fill="none" stroke="white" stroke-width="2"/>
    <path d="M848 344 v8 l6 4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="848" y="390" font-size="10.5" text-anchor="middle" fill="#33414e">Cron job</text>
  </g>

  <!-- isolation note -->
  <text x="446" y="492" font-size="11.5" font-style="italic" fill="#7a8a70">per-user isolation · resource limits · health-check · HA</text>

  <!-- ======================= Right: Observability ======================= -->
  <rect x="960" y="30" width="170" height="480" rx="14" fill="white" stroke="#7a9aab" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1045" y="64" font-size="15" font-weight="bold" text-anchor="middle" fill="#33414e">Observability</text>

  <!-- Prometheus -->
  <rect x="982" y="92" width="126" height="86" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <circle cx="1008" cy="126" r="14" fill="#e6522c"/>
  <path d="M1008 117 v9 M1003 134 a7 7 0 0 0 10 0" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1054" y="122" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Prometheus</text>
  <text x="1054" y="139" font-size="10" text-anchor="middle" fill="#555">scrape</text>
  <text x="1045" y="168" font-size="10.5" text-anchor="middle" fill="#555">metrics :6061</text>

  <!-- Grafana -->
  <rect x="982" y="200" width="126" height="86" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <circle cx="1008" cy="234" r="14" fill="none" stroke="#f46800" stroke-width="2.4"/>
  <circle cx="1008" cy="234" r="8" fill="none" stroke="#f2b02e" stroke-width="2.2"/>
  <circle cx="1008" cy="234" r="2.4" fill="#f46800"/>
  <text x="1054" y="230" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Grafana</text>
  <text x="1054" y="247" font-size="10" text-anchor="middle" fill="#555">dashboard</text>
  <text x="1045" y="276" font-size="10.5" text-anchor="middle" fill="#555">simple-json via Agent</text>

  <!-- Loki -->
  <rect x="982" y="308" width="126" height="86" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <g stroke="#e5b80b" stroke-width="3" stroke-linecap="round">
    <path d="M1000 324 h16 M1000 332 h20 M1000 340 h13 M1000 348 h18"/>
  </g>
  <text x="1054" y="338" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Loki</text>
  <text x="1054" y="355" font-size="10" text-anchor="middle" fill="#555">log query</text>
  <text x="1045" y="384" font-size="10.5" text-anchor="middle" fill="#555">app stdout / logs</text>

  <!-- Promtail -->
  <rect x="982" y="416" width="126" height="64" rx="10" fill="white" stroke="#33414e" stroke-width="1.4" filter="url(#shadow)"/>
  <g stroke="#33414e" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M996 440 h12 M996 447 h16 M996 454 h10"/>
    <path d="M1014 450 l5 4 -5 4"/>
  </g>
  <text x="1058" y="452" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Promtail</text>

  <!-- ======================= Bottom: mesh of nodes ======================= -->
  <rect x="476" y="606" width="180" height="72" rx="10" fill="#e4eee0" stroke="#6a8f5a" stroke-width="1.6"/>
  <rect x="470" y="600" width="180" height="72" rx="10" fill="#f0f6ea" stroke="#6a8f5a" stroke-width="1.6"/>
  <rect x="464" y="594" width="180" height="72" rx="10" fill="white" stroke="#6a8f5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="554" y="626" font-size="14" font-weight="bold" text-anchor="middle" fill="#22331a">Remote App Mesh</text>
  <text x="554" y="645" font-size="14" font-weight="bold" text-anchor="middle" fill="#22331a">Nodes</text>

  <!-- ======================= Arrows ======================= -->
  <g stroke="#444" stroke-width="1.8" fill="none">
    <path d="M180,333 L230,333" marker-end="url(#arr)"/>
    <path d="M180,395 L230,395" marker-end="url(#arr)"/>
    <path d="M180,457 L230,457" marker-end="url(#arr)"/>
    <path d="M380,370 L445,370" marker-end="url(#arr)"/>
    <path d="M642,185 L686,185" marker-end="url(#arr)"/>
    <path d="M642,365 L686,365" marker-end="url(#arr)"/>
    <!-- forward to remote nodes -->
    <path d="M547,440 L547,585" marker-end="url(#arr)"/>
    <!-- prometheus scrape -->
    <path d="M982,135 L930,135 L930,275 L649,275" marker-end="url(#arr)"/>
    <!-- app logs to loki -->
    <path d="M642,422 L668,422 L668,458 L945,458 L945,351 L975,351" marker-end="url(#arr)"/>
    <!-- promtail -> loki -->
    <path d="M1045,416 L1045,401" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" font-style="italic" fill="#555">
    <text x="386" y="358">REST</text>
    <text x="651" y="178">run / manage</text>
    <text x="560" y="545">Forward</text>
    <text x="790" y="270">scrape metrics</text>
    <text x="770" y="452">stdout / log files</text>
  </g>

  <!-- R response marker on REST call -->
  <circle cx="412" cy="370" r="6.5" fill="white" stroke="#444" stroke-width="1.4"/>
  <text x="412" y="366" font-size="9" font-style="italic" fill="#333" text-anchor="middle">R</text>
</svg>
