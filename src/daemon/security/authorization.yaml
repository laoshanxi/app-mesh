---
Authorization:
  # `explicit` rejects unknown Dex subjects. `explicit-or-minimal` creates an active principal
  # with no roles, so authentication succeeds but protected operations remain forbidden.
  provisioning: explicit-or-minimal

  # Built-in mode grants this role exactly once through the loopback enrollment API.
  # The durable marker prevents enrollment from reopening if the administrator is later removed.
  first_admin_role: appmesh-admin
  # Immutable Dex subject derived from the packaged administrator's static userID.
  # This is public identity metadata, not a credential. Only this verified subject
  # may perform the automatic one-time local enrollment.
  first_admin_subject: CiQyZDFjOGMzOC0zODk4LTRjODktYTc4Yi0zY2FhNDJmMjAzYzESBWxvY2Fs
  first_admin_enrolled: false

  principals:
    system:appmesh:
      kind: system
      issuer: appmesh-internal
      subject: appmesh
      status: active
      execution_user: ""
      roles: []

    # The packaged guest login (`guest@appmesh.local`, user ID
    # 93ad39b4-eb6f-4945-97a1-3366451867fb) gets its read-only binding from the
    # authentication bootstrap, which derives the principal ID from the
    # configured issuer: "oidc:" + SHA-256 hex of issuer + NUL + subject. The
    # static-password subject is base64url(protobuf{field1: userID,
    # field2: "local"}). Seeding — not this template — owns the entry so exactly
    # one guest binding exists per deployment; bootstrap also retires the
    # factory-default-issuer binding from policies written by older versions.
    # display_name and email are pre-filled so the principal list names this
    # identity before its first sign-in; a sign-in refreshes them from the token.

  roles:
    # Package lifecycle automation may enumerate and stop non-system Apps. It
    # deliberately has no Principal, role, configuration, or first-admin
    # administration capabilities. app-manage-all only bypasses per-App owner
    # share bits; app-control remains required for enable/disable operations.
    # host-resource-view is read-only; it lets the automation client scrape
    # /metrics (for example the packaged Prometheus stack).
    appmesh-maintenance:
      - app-control
      - app-manage-all
      - app-view-all
      - host-resource-view
    # Register and run own workflows; runs execute as their owner and step
    # processes are temporary Apps removed after each step (hence app-delete).
    appmesh-workflow-runner:
      - app-reg
      - app-run-async
      - app-run-task
      - app-subscribe
      - app-view
      - app-output-view
      - app-delete
      - label-view
    appmesh-admin:
      - app-control
      - app-delete
      - app-manage-all
      - app-reg
      - app-subscribe
      - app-run-async
      - app-run-sync
      - app-run-task
      - app-view-all
      - app-view
      - app-output-view
      - config-set
      - config-view
      - file-download
      - file-upload
      - file-delete
      - host-resource-view
      - label-delete
      - label-set
      - label-view
      - permission-list
      - principal-delete
      - principal-list
      - principal-set
      - role-delete
      - role-set
      - role-view
      - workflow-admin
    appmesh-viewer:
      - app-view-all
      - app-view
      - app-output-view
      - config-view
      - host-resource-view
      - label-view
      - role-view
