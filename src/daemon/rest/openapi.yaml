openapi: 3.1.0
info:
  title: App Mesh API
  version: 3.0.0
  description: |
    App Mesh is an OAuth 2.0 protected resource. It trusts one configured issuer.
    This API never accepts usernames, passwords, MFA codes, upstream IdP tokens,
    or locally issued App Mesh credentials.
servers:
  - url: https://127.0.0.1:6060

tags:
  - name: Discovery
  - name: Principal
  - name: Authorization
  - name: Applications
  - name: Tasks
  - name: EventSubscription
  - name: Configuration
  - name: Files
  - name: Labels
  - name: Observability

paths:
  /.well-known/oauth-protected-resource:
    get:
      tags: [Discovery]
      summary: OAuth protected resource metadata
      security: []
      responses:
        "200":
          description: RFC 9728 metadata that points to the configured issuer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"

  /appmesh/auth/config:
    get:
      tags: [Discovery]
      summary: Public authentication client configuration
      security: []
      responses:
        "200":
          description: Issuer, App Mesh resource, audience, public client, scopes, and supported flows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /appmesh/logo.svg:
    get:
      tags: [Discovery]
      summary: Branding logo for the authentication-service login page
      description: |
        The login page references its logo issuer-path relative, and every public
        entry (agent, web UI proxy) resolves it to this route, so the asset follows
        the address the browser used.
      security: []
      responses:
        "200":
          description: The SVG logo served by this node.
          content:
            image/svg+xml:
              schema:
                type: string

  /appmesh/favicon.png:
    get:
      tags: [Discovery]
      summary: Branding favicon for the authentication-service login page
      description: |
        The login page loads its favicon from the issuer-relative theme path, and
        every public entry (agent, web UI proxy) resolves it to this route.
      security: []
      responses:
        "200":
          description: The PNG favicon served by this node.
          content:
            image/png:
              schema:
                type: string
                format: binary

  /oauth/callback:
    get:
      tags: [Discovery]
      summary: Static OAuth callback relay page
      description: |
        The web UI requests <browser_entry-origin>/oauth/callback in the
        authorization-code flow. Every fronted entry serves this static page.
        It decodes the web UI origin from the OAuth state parameter and returns
        the unchanged query string to the fixed /oauth/callback path on that
        origin. Invalid or missing state or code shows an error and never
        redirects. The agent serves the byte-identical page.
      security: []
      responses:
        "200":
          description: The static relay page.
          content:
            text/html:
              schema:
                type: string

  /appmesh/auth/enroll-first-admin:
    post:
      tags: [Authorization]
      summary: Enroll the first built-in App Mesh administrator
      description: |
        One-time operator action available only on a built-in standalone/owner node
        while no administrator has ever been enrolled. The caller must present a verified bearer over a
        direct loopback connection, and its immutable subject must equal the configured packaged-administrator
        subject advertised while enrollment is open. No username, email, token role, or first-caller rule grants access.
        WebSocket callers are identified by the principal that the upgrade verified
        and pinned on the session. A forwarded frame repeats the same bearer for target validation.
        The operation rejects all forwarded requests.
      responses:
        "200":
          description: The verified OIDC Principal was atomically enrolled as first administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /appmesh/principal/self:
    get:
      tags: [Principal]
      summary: Current verified principal and App Mesh authorization
      responses:
        "200":
          description: Principal metadata and effective permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /appmesh/principal/self/permissions:
    get:
      tags: [Authorization]
      summary: Current principal effective permissions
      responses:
        "200":
          description: Permission identifiers.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /appmesh/principals:
    get:
      tags: [Authorization]
      summary: List App Mesh authorization principals
      description: This is authorization state, not an identity-directory user list.
      responses:
        "200":
          description: Principals keyed by stable principal ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/principal/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/PrincipalId"
    post:
      tags: [Authorization]
      summary: Update an App Mesh principal policy
      description: Updates roles, status, or execution mapping only. It never changes directory identity data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrincipalPolicy"
      responses:
        "200":
          description: Updated authorization principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Authorization]
      summary: Delete an App Mesh authorization principal
      responses:
        "204": { description: Principal policy removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/roles:
    get:
      tags: [Authorization]
      summary: List App Mesh roles
      responses:
        "200":
          description: Role-to-permission mapping.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/role/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Authorization]
      summary: Create or replace a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        "200": { description: Role saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Authorization]
      summary: Delete an unused role
      responses:
        "200": { description: Role deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/permissions:
    get:
      tags: [Authorization]
      summary: List available permission identifiers
      responses:
        "200":
          description: Permission identifiers.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/applications:
    get:
      tags: [Applications]
      summary: List visible applications
      responses:
        "200":
          description: Applications visible under the current principal policy.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [Applications]
      summary: Get an application
      responses:
        "200":
          description: Application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Applications]
      summary: Register or update a non-system application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Application" }
      responses:
        "200": { description: Application saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Applications]
      summary: Delete a non-system application
      responses:
        "200": { description: Application deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/enable:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Applications]
      summary: Enable a non-system application
      responses:
        "200": { description: Application enabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/disable:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Applications]
      summary: Disable a non-system application
      responses:
        "200": { description: Application disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/output:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [Applications]
      summary: Read application output
      responses:
        "200": { description: Output bytes or text. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/health:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [Applications]
      summary: Get application health
      responses:
        "200": { description: Application health result. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/run:
    post:
      tags: [Applications]
      summary: Start an asynchronous command
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Application" }
      responses:
        "200": { description: Run identifier and process metadata. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/syncrun:
    post:
      tags: [Applications]
      summary: Run a command synchronously
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Application" }
      responses:
        "200": { description: Command output and exit status. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/task:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Tasks]
      summary: Send a task request to a managed application
      description: Requires the app-run-task permission and write access to the target application.
      parameters:
        - name: timeout
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: Task response returned by the managed application. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      summary: Cancel the pending task request for a managed application
      description: Requires the app-run-task permission and write access to the target application.
      responses:
        "200": { description: Pending task request removed. }
        "208": { description: No pending task request was removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Tasks]
      summary: Fetch the next task payload for a managed application process
      description: |
        Worker RPC. Only a managed local process on a direct private transport
        can call this operation; a bearer-authenticated client must use POST.
        The process proof goes in the X-AppMesh-Process-Key header. The
        process_key query parameter is not supported. The request waits until a
        task arrives.
      security: []
      parameters:
        - name: X-AppMesh-Process-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200": { description: Task payload sent by the invoking client. }
        "400": { description: Worker request permanently rejected. A retry cannot recover it. }
        "412": { description: Process key superseded by a newer process instance. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Tasks]
      summary: Return the task result from a managed application process
      description: |
        Worker RPC. Use the same transport and header requirements as the fetch
        operation.
      security: []
      parameters:
        - name: X-AppMesh-Process-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: Result accepted. The daemon delivers it to the invoking client. }
        "400": { description: Worker request permanently rejected. A retry cannot recover it. }
        "412": { description: Process key superseded by a newer process instance. }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/app/{name}/subscribe:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [EventSubscription]
      summary: Subscribe to events from one application
      description: Requires app-subscribe permission, read access to the target application, and a persistent TCP or WebSocket connection.
      parameters:
        - $ref: "#/components/parameters/SubscriptionEvents"
      responses:
        "200": { $ref: "#/components/responses/SubscriptionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { description: A persistent TCP or WebSocket connection is required. }
    delete:
      tags: [EventSubscription]
      summary: Remove an event subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200": { description: Subscription removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/subscribe:
    post:
      tags: [EventSubscription]
      summary: Subscribe to events from all applications
      description: Requires both app-subscribe and app-view-all permissions and a persistent TCP or WebSocket connection.
      parameters:
        - $ref: "#/components/parameters/SubscriptionEvents"
      responses:
        "200": { $ref: "#/components/responses/SubscriptionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { description: A persistent TCP or WebSocket connection is required. }
    delete:
      tags: [EventSubscription]
      summary: Remove an event subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200": { description: Subscription removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/config:
    get:
      tags: [Configuration]
      summary: Get runtime configuration
      responses:
        "200": { description: Runtime configuration. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Configuration]
      summary: Update runtime configuration
      responses:
        "200": { description: Updated runtime configuration. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/file/download:
    get:
      tags: [Files]
      summary: Download a file
      responses:
        "200": { description: File stream negotiation response. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/file/upload:
    post:
      tags: [Files]
      summary: Upload a file
      responses:
        "200": { description: File stream negotiation response. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/labels:
    get:
      tags: [Labels]
      summary: List host labels
      responses:
        "200": { description: Label mapping. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/label/{label}:
    parameters:
      - name: label
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Labels]
      summary: Set a host label
      responses:
        "200": { description: Label saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Labels]
      summary: Delete a host label
      responses:
        "200": { description: Label deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/resources:
    get:
      tags: [Observability]
      summary: Get host resources
      responses:
        "200": { description: Host resource snapshot. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/metrics:
    get:
      tags: [Observability]
      summary: Get Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /metrics:
    get:
      tags: [Observability]
      summary: Get Prometheus metrics
      description: Compatibility alias for /appmesh/metrics. Requires host-resource-view permission.
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    oidcBearer:
      type: oauth2
      description: Discover authorization endpoints from the configured OpenID Connect metadata.
      flows:
        authorizationCode:
          authorizationUrl: http://127.0.0.1:6062/auth/auth
          tokenUrl: http://127.0.0.1:6062/auth/token
          scopes:
            openid: Establish the subject.
            profile: Request display claims.
            email: Request email claims.
            offline_access: Allow refresh tokens for trusted clients.

  parameters:
    PrincipalId:
      name: principal_id
      in: path
      required: true
      schema: { type: string }
    AppName:
      name: name
      in: path
      required: true
      schema: { type: string }
    SubscriptionEvents:
      name: events
      in: query
      required: false
      description: Comma-separated application event names. The server default selects all supported events.
      schema: { type: string }
    SubscriptionId:
      name: subscription_id
      in: query
      required: true
      schema: { type: string, minLength: 1 }

  schemas:
    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: { type: string, format: uri }
        authorization_servers:
          type: array
          items: { type: string, format: uri }
        scopes_supported:
          type: array
          items: { type: string }
        bearer_methods_supported:
          type: array
          items: { type: string }
    AuthConfig:
      type: object
      required: [issuer, resource, browser_entry, audience, public_client_id, scopes, flows, first_admin_enrollment]
      properties:
        issuer: { type: string, format: uri }
        resource: { type: string, format: uri }
        browser_entry:
          type: string
          format: uri
          description: Browser entry that fronts the issuer path (agent or web
            proxy). The web UI registers <origin>/oauth/callback on it as its
            single redirect URI. Defaults to this node's HTTPS REST listener
            when not configured.
        audience: { type: string }
        public_client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        flows:
          type: array
          items:
            type: string
            enum: [authorization_code_pkce, device_code, password]
        first_admin_enrollment:
          $ref: "#/components/schemas/FirstAdminEnrollment"
    FirstAdminEnrollment:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: True only while the local built-in packaged-administrator claim is open.
        subject:
          type: string
          description: Immutable packaged-administrator subject. Present only while available is true.
    Principal:
      type: object
      required: [principal_id, kind, issuer, subject, status, roles]
      properties:
        principal_id: { type: string }
        kind: { type: string, enum: [user, service, system] }
        issuer: { type: string, format: uri-reference }
        subject: { type: string }
        display_name: { type: string }
        email: { type: string }
        connector_id: { type: string }
        status: { type: string, enum: [active, disabled, tombstoned] }
        execution_user: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    PrincipalPolicy:
      type: object
      properties:
        status: { type: string, enum: [active, disabled, tombstoned] }
        execution_user: { type: string }
        roles:
          type: array
          items: { type: string }
      additionalProperties: false
    Application:
      type: object
      description: >-
        Application definition and runtime view.
      properties:
        name: { type: string, description: Application name. Unique registration key. }
        command:
          type: string
          description: >-
            Command line to run. Omit it when an existing application runs as
            an on-demand template. Docker applications use docker_image instead.
        description: { type: string, description: Free-text purpose of the application. }
        owner_principal_id:
          type: string
          description: >-
            Owning principal. Forced to the caller on register, unless the caller
            holds the app-manage-all permission and names another existing active
            principal here (ownership transfer or administrative takeover).
        owner_display_name:
          type: string
          readOnly: true
          description: >-
            Human-readable owner label derived from verified Principal metadata. It is
            mutable, may be absent or non-unique, and is never used for authorization.
        permission:
          type: integer
          description: >-
            Share bits for principals other than the owner, encoded as two decimal
            digits <other><group>. Only the tens (other) digit is enforced:
            1 = deny, 2 = read, 3 = read and write (write implies read).
            0 (default) makes the application accessible to every principal.
            Holders of app-view-all bypass these bits for read access and holders
            of app-manage-all for every operation.
        execution_user:
          type: string
          readOnly: true
          description: >-
            Operating system user that runs the process. Derived from the owner
            Principal execution mapping; clients cannot set it directly.
        system:
          type: boolean
          readOnly: true
          description: True for bundled platform applications that the application API cannot change.
        startup_phase:
          type: string
          enum: [auth-issuer, ingress, normal]
          readOnly: true
          description: Start order of bundled applications at daemon startup.
        depends_on:
          type: array
          items: { type: string }
          uniqueItems: true
          description: >-
            Application names this application depends on. Every dependency must be
            registered, enabled, running, and healthy before this application starts
            or restarts. A dependency that stops does not stop this application; it
            only holds the next start until the dependency is healthy again. A name
            that is not registered does not gate (for example, the dependency was
            deleted); registration itself requires every name to exist. Only
            continuously scheduled applications accept dependencies (cron and
            interval schedules are rejected), and cycles are rejected. On-demand
            runs bypass this gate.
        waiting_for:
          type: array
          items: { type: string }
          readOnly: true
          description: >-
            Dependencies not yet satisfied at the last scheduler pass. Present only
            while the application is held back by its dependency gate.
        metadata:
          type: object
          description: >-
            Free-form JSON passed to the process as stdin content. Docker
            applications use it as the container definition.
        shell:
          type: boolean
          description: Run the command through a generated shell script instead of a direct exec.
        session_login:
          type: boolean
          description: Start the process as a login session (sudo --login semantics).
        working_dir: { type: string, description: Working directory for the process. }
        docker_image: { type: string, description: Docker image to run instead of a local command. }
        env:
          type: object
          additionalProperties: { type: string }
          description: Environment variables for the process. Every value must be a string.
        secret_env:
          type: object
          additionalProperties: { type: string }
          writeOnly: true
          description: >-
            Protected environment variables. Send plaintext values; the daemon
            encrypts them before persistence. Responses never return them.
        enabled:
          type: boolean
          description: >-
            Whether the application is enabled. Registration and update bodies may
            also carry the legacy numeric form (1/0), which stays accepted for
            compatibility with persisted definitions.
        health_check_cmd:
          type: string
          description: Custom readiness probe. The application turns healthy only after this command exits 0.
        interval:
          type: [integer, string]
          description: >-
            Fixed-period schedule: seconds, or a duration string such as
            "1m30s". Mutually exclusive with cron_schedule.
        cron_schedule:
          type: string
          description: >-
            Cron expression, for example "0 */5 * * * *". Presence of this
            property selects the cron schedule kind. Mutually exclusive with
            interval.
        stop_grace_period:
          type: [integer, string]
          description: >-
            Grace before the daemon terminates the previous run of a periodic
            application, and delay before removal cleanup: seconds, or a
            duration string such as "1m30s".
        start_time:
          type: integer
          description: Epoch seconds from which the application may run.
        end_time:
          type: integer
          description: Epoch seconds after which the application no longer runs.
        daily_limitation:
          type: object
          description: Availability window inside one day. Both bounds are required together.
          properties:
            daily_start:
              type: integer
              description: Seconds within a day when the window opens. The value is taken modulo 86400.
            daily_end:
              type: integer
              description: Seconds within a day when the window closes. The value is taken modulo 86400.
        resource_limit:
          type: object
          description: Resource caps applied to the process (Linux cgroups).
          properties:
            memory_mb: { type: integer, description: Physical memory cap in megabytes. }
            memory_virt_mb: { type: integer, description: Virtual memory cap in megabytes. }
            cpu_shares: { type: integer, description: Relative CPU weight. }
        stdout_backup_count:
          type: integer
          description: >-
            Number of stdout files from previous process runs kept in rotation.
            Each (re)start renames the current file to the next index and deletes
            files beyond this count. 0 (default) deletes the previous file on
            every restart.
        behavior:
          type: object
          description: Action taken after a run exits.
          properties:
            exit:
              type: string
              enum: [standby, restart, keepalive, remove]
              description: Action for exit codes not listed in exit_code_actions.
            exit_code_actions:
              type: object
              additionalProperties:
                type: string
                enum: [standby, restart, keepalive, remove]
              description: Maps a numeric exit code, as string key, to the action for that code.
        pid:
          type: integer
          readOnly: true
          description: Process ID of the current run. Omitted until a valid PID is published.
        pid_user:
          type: string
          readOnly: true
          description: Operating system user of the current process.
        return_code:
          type: integer
          readOnly: true
          description: Exit code of the last finished run.
        health:
          type: integer
          readOnly: true
          description: Health result of the last probe. 0 means healthy, 1 means unhealthy.
        memory:
          type: integer
          readOnly: true
          description: Resident memory of the current run, in bytes.
        cpu:
          type: integer
          readOnly: true
          description: CPU usage of the current run, in percent.
        fd:
          type: integer
          readOnly: true
          description: Open file descriptors of the current process.
        pstree:
          type: string
          readOnly: true
          description: Process tree under the current run.
        container_id:
          type: string
          readOnly: true
          description: Docker container ID of the current run. Docker applications only.
        last_start_time:
          type: integer
          readOnly: true
          description: Epoch seconds of the last accepted start.
        last_exit_time:
          type: integer
          readOnly: true
          description: Epoch seconds of the last exit.
        next_start_time:
          type: integer
          readOnly: true
          description: Epoch seconds of the next scheduled start.
        starts:
          type: integer
          readOnly: true
          description: Count of accepted starts since registration.
        last_error:
          type: string
          readOnly: true
          description: Last failure message, prefixed with a local timestamp.
        task_id:
          type: integer
          readOnly: true
          description: Identifier of the pending worker-task request. Present only while a task waits.
        task_status:
          type: string
          readOnly: true
          description: Status of the pending worker-task request. Present only while a task waits.
        register_time:
          type: integer
          readOnly: true
          description: Epoch seconds when the application was registered.
        stdout_file_count:
          type: integer
          readOnly: true
          description: >-
            Count of rotated stdout files currently kept. This property is a
            file count, not a byte size.
      additionalProperties: true
    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid, expired, wrong-issuer, or wrong-audience bearer token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The verified principal lacks the required App Mesh permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SubscriptionCreated:
      description: Subscription created.
      content:
        application/json:
          schema:
            type: object
            required: [subscription_id, app_name, events]
            properties:
              subscription_id: { type: string }
              app_name: { type: string }
              events:
                type: array
                items: { type: string }
    AuthUnavailable:
      description: Authentication discovery or signing keys are unavailable and no usable cached key exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - oidcBearer: [openid]
