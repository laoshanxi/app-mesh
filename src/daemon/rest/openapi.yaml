openapi: 3.1.0
info:
  title: App Mesh API
  version: 3.0.0
  description: |
    App Mesh is an OAuth 2.0 protected resource. Dex is the only trusted issuer.
    This API never accepts usernames, passwords, MFA codes, upstream IdP tokens,
    or locally issued App Mesh credentials.
servers:
  - url: https://127.0.0.1:6060

tags:
  - name: Discovery
  - name: Principal
  - name: Authorization
  - name: Applications
  - name: Tasks
  - name: EventSubscription
  - name: Configuration
  - name: Files
  - name: Labels
  - name: Observability

paths:
  /.well-known/oauth-protected-resource:
    get:
      tags: [Discovery]
      summary: OAuth protected resource metadata
      security: []
      responses:
        "200":
          description: RFC 9728 metadata pointing only to the configured Dex issuer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"

  /appmesh/auth/config:
    get:
      tags: [Discovery]
      summary: Public Dex client configuration
      security: []
      responses:
        "200":
          description: Dex issuer, App Mesh resource, audience, public client, scopes, and supported flows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /appmesh/auth/enroll-first-admin:
    post:
      tags: [Authorization]
      summary: Enroll the first built-in App Mesh administrator
      description: |
        One-time operator action available only on a built-in standalone/owner node
        while no administrator has ever been enrolled. The caller must present a verified Dex bearer over a
        direct loopback connection and the current daemon-generated enrollment proof.
        WebSocket callers are identified by the principal their upgrade verified and
        pinned on the session; frames never re-send the Authorization header.
        Agent-forwarded TCP requests are accepted only with the private Agent-to-Engine
        envelope; forwarded address headers are never trusted.
      parameters:
        - name: X-AppMesh-First-Admin-Enrollment
          in: header
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "200":
          description: The verified OIDC Principal was atomically enrolled as first administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /appmesh/principal/self:
    get:
      tags: [Principal]
      summary: Current verified Dex principal and App Mesh authorization
      responses:
        "200":
          description: Principal metadata and effective permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /appmesh/principal/self/permissions:
    get:
      tags: [Authorization]
      summary: Current principal effective permissions
      responses:
        "200":
          description: Permission identifiers.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /appmesh/principals:
    get:
      tags: [Authorization]
      summary: List App Mesh authorization principals
      description: This is authorization state, not an identity-directory user list.
      responses:
        "200":
          description: Principals keyed by stable principal ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/principal/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/PrincipalId"
    post:
      tags: [Authorization]
      summary: Update an App Mesh principal policy
      description: Updates roles, status, or execution mapping only. It never changes directory identity data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrincipalPolicy"
      responses:
        "200":
          description: Updated authorization principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Authorization]
      summary: Delete an App Mesh authorization principal
      responses:
        "204": { description: Principal policy removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/roles:
    get:
      tags: [Authorization]
      summary: List App Mesh roles
      responses:
        "200":
          description: Role-to-permission mapping.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/role/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Authorization]
      summary: Create or replace a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        "200": { description: Role saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Authorization]
      summary: Delete an unused role
      responses:
        "200": { description: Role deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/permissions:
    get:
      tags: [Authorization]
      summary: List available permission identifiers
      responses:
        "200":
          description: Permission identifiers.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/applications:
    get:
      tags: [Applications]
      summary: List visible applications
      responses:
        "200":
          description: Applications visible under the current principal policy.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [Applications]
      summary: Get an application
      responses:
        "200":
          description: Application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Applications]
      summary: Register or update a non-system application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Application" }
      responses:
        "200": { description: Application saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Applications]
      summary: Delete a non-system application
      responses:
        "200": { description: Application deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/enable:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Applications]
      summary: Enable a non-system application
      responses:
        "200": { description: Application enabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/disable:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Applications]
      summary: Disable a non-system application
      responses:
        "200": { description: Application disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/output:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [Applications]
      summary: Read application output
      responses:
        "200": { description: Output bytes or text. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/health:
    parameters:
      - $ref: "#/components/parameters/AppName"
    get:
      tags: [Applications]
      summary: Get application health
      responses:
        "200": { description: Application health result. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/run:
    post:
      tags: [Applications]
      summary: Start an asynchronous command
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Application" }
      responses:
        "200": { description: Run identifier and process metadata. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/syncrun:
    post:
      tags: [Applications]
      summary: Run a command synchronously
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Application" }
      responses:
        "200": { description: Command output and exit status. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/app/{name}/task:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [Tasks]
      summary: Send a task request to a managed application
      description: Requires the app-run-task permission and write access to the target application.
      parameters:
        - name: timeout
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200": { description: Task response returned by the managed application. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      summary: Cancel the pending task request for a managed application
      description: Requires the app-run-task permission and write access to the target application.
      responses:
        "200": { description: Pending task request removed. }
        "208": { description: No pending task request was removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/app/{name}/subscribe:
    parameters:
      - $ref: "#/components/parameters/AppName"
    post:
      tags: [EventSubscription]
      summary: Subscribe to events from one application
      description: Requires app-subscribe permission, read access to the target application, and a persistent TCP or WebSocket connection.
      parameters:
        - $ref: "#/components/parameters/SubscriptionEvents"
      responses:
        "200": { $ref: "#/components/responses/SubscriptionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { description: A persistent TCP or WebSocket connection is required. }
    delete:
      tags: [EventSubscription]
      summary: Remove an event subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200": { description: Subscription removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/subscribe:
    post:
      tags: [EventSubscription]
      summary: Subscribe to events from all applications
      description: Requires both app-subscribe and app-view-all permissions and a persistent TCP or WebSocket connection.
      parameters:
        - $ref: "#/components/parameters/SubscriptionEvents"
      responses:
        "200": { $ref: "#/components/responses/SubscriptionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { description: A persistent TCP or WebSocket connection is required. }
    delete:
      tags: [EventSubscription]
      summary: Remove an event subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200": { description: Subscription removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appmesh/config:
    get:
      tags: [Configuration]
      summary: Get runtime configuration
      responses:
        "200": { description: Runtime configuration. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Configuration]
      summary: Update runtime configuration
      responses:
        "200": { description: Updated runtime configuration. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/file/download:
    get:
      tags: [Files]
      summary: Download a file
      responses:
        "200": { description: File stream negotiation response. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/file/upload:
    post:
      tags: [Files]
      summary: Upload a file
      responses:
        "200": { description: File stream negotiation response. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/labels:
    get:
      tags: [Labels]
      summary: List host labels
      responses:
        "200": { description: Label mapping. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/label/{label}:
    parameters:
      - name: label
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Labels]
      summary: Set a host label
      responses:
        "200": { description: Label saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Labels]
      summary: Delete a host label
      responses:
        "200": { description: Label deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/resources:
    get:
      tags: [Observability]
      summary: Get host resources
      responses:
        "200": { description: Host resource snapshot. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /appmesh/metrics:
    get:
      tags: [Observability]
      summary: Get Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /metrics:
    get:
      tags: [Observability]
      summary: Get Prometheus metrics
      description: Compatibility alias for /appmesh/metrics. Requires host-resource-view permission.
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    dexBearer:
      type: oauth2
      description: Dex is the sole authorization server. Discover endpoints from its OIDC metadata.
      flows:
        authorizationCode:
          authorizationUrl: http://127.0.0.1:6062/dex/auth
          tokenUrl: http://127.0.0.1:6062/dex/token
          scopes:
            openid: Establish the Dex subject.
            profile: Request display claims.
            email: Request email claims.
            offline_access: Allow Dex refresh tokens for trusted clients.

  parameters:
    PrincipalId:
      name: principal_id
      in: path
      required: true
      schema: { type: string }
    AppName:
      name: name
      in: path
      required: true
      schema: { type: string }
    SubscriptionEvents:
      name: events
      in: query
      required: false
      description: Comma-separated application event names. The server default selects all supported events.
      schema: { type: string }
    SubscriptionId:
      name: subscription_id
      in: query
      required: true
      schema: { type: string, minLength: 1 }

  schemas:
    ProtectedResourceMetadata:
      type: object
      required: [resource, authorization_servers]
      properties:
        resource: { type: string, format: uri }
        authorization_servers:
          type: array
          items: { type: string, format: uri }
        scopes_supported:
          type: array
          items: { type: string }
        bearer_methods_supported:
          type: array
          items: { type: string }
    AuthConfig:
      type: object
      required: [issuer, resource, audience, public_client_id, scopes, flows]
      properties:
        issuer: { type: string, format: uri }
        resource: { type: string, format: uri }
        audience: { type: string }
        public_client_id: { type: string }
        scopes:
          type: array
          items: { type: string }
        flows:
          type: array
          items:
            type: string
            enum: [authorization_code_pkce, device_code]
    Principal:
      type: object
      required: [principal_id, kind, issuer, subject, status, roles]
      properties:
        principal_id: { type: string }
        kind: { type: string, enum: [user, service, system] }
        issuer: { type: string, format: uri-reference }
        subject: { type: string }
        display_name: { type: string }
        email: { type: string }
        connector_id: { type: string }
        status: { type: string, enum: [active, disabled, tombstoned] }
        execution_user: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
    PrincipalPolicy:
      type: object
      properties:
        status: { type: string, enum: [active, disabled, tombstoned] }
        execution_user: { type: string }
        roles:
          type: array
          items: { type: string }
      additionalProperties: false
    Application:
      type: object
      properties:
        name: { type: string }
        command: { type: string }
        owner_principal_id:
          type: string
          description: >-
            Owning principal. Forced to the caller on register, unless the caller
            holds the app-manage-all permission and names another existing active
            principal here (ownership transfer or administrative takeover).
        permission:
          type: integer
          description: >-
            Share bits for principals other than the owner, encoded as two decimal
            digits <other><group>. Only the tens (other) digit is enforced:
            1 = deny, 2 = read, 3 = read and write (write implies read).
            0 (default) makes the application accessible to every principal.
            Holders of app-view-all bypass these bits for read access and holders
            of app-manage-all for every operation.
        execution_user: { type: string, readOnly: true }
        system: { type: boolean, readOnly: true }
        startup_phase:
          type: string
          enum: [auth-issuer, ingress, normal]
          readOnly: true
        status:
          type: boolean
          description: >-
            Whether the application is enabled. Registration and update bodies may
            also carry the legacy numeric form (1/0), which stays accepted for
            compatibility with persisted definitions.
      additionalProperties: true
    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid, expired, wrong-issuer, or wrong-audience Dex bearer token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The verified principal lacks the required App Mesh permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SubscriptionCreated:
      description: Subscription created.
      content:
        application/json:
          schema:
            type: object
            required: [subscription_id, app_name, events]
            properties:
              subscription_id: { type: string }
              app_name: { type: string }
              events:
                type: array
                items: { type: string }
    AuthUnavailable:
      description: Dex discovery or JWKS is unavailable and no usable cached key exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - dexBearer: [openid]
