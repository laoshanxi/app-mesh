BaseConfig:
  # The default operating system user for app execution. This user will be used when no specific execution user is provided.
  DefaultExecUser: ""

  # When true, all applications will run under the AppMesh systemd user instead of individual users.
  # Applications will follow the appmesh systemd user set during installation (APPMESH_DAEMON_EXEC_USER/APPMESH_DAEMON_EXEC_USER_GROUP).
  DisableExecUser: false

  # Interval (in seconds) of the scheduler loop that reconciles application state
  # (start/stop/restart decisions, dependency gates, and health checks).
  # Increase this value if frequent checks are unnecessary.
  ScheduleIntervalSeconds: 1

  # Working directory for AppMesh, with a default of /opt/appmesh/work.
  WorkingDirectory: ""

  # Log level for the system (available options: DEBUG, INFO, NOTICE, WARN, ERROR).
  LogLevel: INFO

  # Time zone setting for AppMesh logs, in POSIX format.
  PosixTimezone: "+08"

REST:
  # Enables or disables the REST API interface.
  RestEnabled: true

  # Address for REST API access.
  # Use "localhost" for local access only, or "0.0.0.0" to allow external access.
  RestListenAddress: 127.0.0.1

  # HTTP port for the REST API.
  RestListenPort: 6060

  # TCP port for the TCP API; 0 disables the TCP listener.
  TcpApiPort: 6059

  # WebSocket port for the WSS API; 0 disables the WebSocket listener.
  WebSocketPort: 6058

  # Port for Prometheus metrics export.
  # To enable metrics collection, set to a specific port (e.g., 9091).
  PrometheusExporterListenPort: 0

  # Threads that process requests for every transport. This is the main
  # concurrency control: all HTTP, WebSocket and TCP requests share this pool.
  # 0 derives from the CPUs the daemon may use (cgroup limits honored),
  # capped at 8; set a value explicitly for larger pools.
  WorkerThreads: 0
  # Event-loop threads per transport: each listener (the HTTPS/WSS listener and
  # the TCP listener) gets this many, and the outbound forwarding client spreads
  # its peer connections over this many. Requests are dispatched to
  # WorkerThreads, so these threads only multiplex.
  # 0 derives a quarter of the available CPUs, clamped to 2..4.
  TransportIoThreads: 0

  # When true, CORS headers will not be added to responses.
  CorsDisabled: false

  # CSRF: browser Origins allowed to send cookie-authenticated writes (POST/PUT/DELETE).
  # When to set: ONLY when the browser UI runs on a different origin than the API but the same
  # site (e.g. UI on a sibling subdomain/port). Not needed if UI and API share one origin (e.g.
  # behind one nginx domain); a fully different domain can't use cookie auth anyway (SameSite=Strict).
  # SDK/Bearer clients carry no cookie and are unaffected. Multiple values supported.
  # e.g. CsrfAllowedOrigins: ["https://ui.example.com", "https://admin.example.com"]
  CsrfAllowedOrigins: []

  # Request replay protection: nonce dedup for authenticated requests.
  # off     - no replay checks (default)
  # audit   - log detected replays, do not reject
  # enforce - reject replays with 409; authenticated requests must carry a fresh
  #           nonce (X-Nonce, or the frame uuid on WSS/TCP)
  RequestReplayProtection: "off"

  # HMAC request signature: binds method + path + query + body hash + timestamp
  # + nonce to an API key secret (POST /appmesh/security/apikeys). This is an
  # integrity layer on top of bearer authentication, not a replacement.
  # off     - no signature checks (default)
  # audit   - verify when the signature headers are present, log failures
  # enforce - authenticated requests must carry a valid signature (401 otherwise)
  RequestSignature: "off"

  # Replay window in seconds (10..3600): how long a nonce is remembered and how
  # far an X-Timestamp may drift from the daemon clock.
  RequestReplayWindowSeconds: 300

  # Allowed base directory for file upload/download operations.
  # The daemon's own installation tree is always refused, even inside this directory.
  # Empty (the default) means no jail: paths outside the daemon's own tree are
  # transferable as far as the daemon's OS user allows.
  FileAllowedBaseDir:

  SSL:
    # TLS on every listener. Set false only when TLS terminates at an upstream
    # gateway and the daemon runs on a trusted network: every listener then
    # accepts plaintext and the certificate paths below are ignored.
    SSLEnabled: true

    # Path to the Certificate Authority (CA) certificate.
    SSLCaPath: ssl/ca.pem

    # Server certificate (chain) and private key file paths.
    SSLCertificateFile: ssl/server.pem
    SSLCertificateKeyFile: ssl/server-key.pem

    # Client certificate and private key file paths.
    SSLClientCertificateFile: ssl/client.pem
    SSLClientCertificateKeyFile: ssl/client-key.pem

    # Require valid client certificates for incoming connections.
    VerifyClient: false

    # Verify certificates when App Mesh connects to a server; false accepts invalid/self-signed certificates.
    VerifyServer: false

# Node labels. The daemon adds the automatic host name, arch, and (on Linux)
# os_version labels at startup; list only custom labels here, e.g.
#   Labels:
#     env: production
# Docker application policy. Hot-reloaded on SIGHUP like the rest of this file.
Docker:
  # Gate on high-risk host-facing container settings (privileged, pid=host,
  # binds of / or the docker socket, CapAdd SYS_ADMIN/SYS_PTRACE) found in a
  # container definition (metadata) or raw APP_DOCKER_OPTS flags.
  # off     - no checks (default)
  # audit   - log the findings, allow the start
  # enforce - reject the start with a clear error
  HostSecurityPolicy: "off"

Labels: {}
