[package]
name = "appm"
version = "3.0.0"
edition = "2021"
description = "App Mesh CLI - Rust implementation using WSS transport"

[[bin]]
name = "appm"
path = "src/main.rs"

[dependencies]
appmesh = { path = "../sdk/rust" }
clap = { version = "4", features = ["derive", "string"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rustyline = "18"
rpassword = "7"
dirs = "6"
terminal_size = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
jiff = "0.2"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
zeroize = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
