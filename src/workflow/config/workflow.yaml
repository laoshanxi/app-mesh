---
command: ../../bin/workflow
name: workflow
description: Workflow engine using caller bearer delegation and Engine-issued internal run capabilities
owner_principal_id: system:appmesh
system: true
startup_phase: normal
env:
  # Verify the daemon REST callback (self-signed cert) during principal lookup.
  APPMESH_CA: /opt/appmesh/ssl/ca.pem
behavior:
  exit: restart
metadata:
  type: workflow-system
status: 1
