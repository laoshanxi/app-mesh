---
# App Mesh App definition that hosts the MCP server itself.
#
# Register it so App Mesh keeps the MCP server alive, and so you can
# enable / disable / remove it at any time, decoupled from the daemon:
#
#   appm add --stdin appmesh_mcp_app.yaml   # register from this file
#   appm disable -a mcp-server              # stop serving MCP
#   appm enable  -a mcp-server              # resume
#   appm rm      -a mcp-server              # remove entirely ("don't want it anymore")
#
# Adjust paths to where this directory is deployed (default assumes
# /opt/appmesh/sdk/mcp_server) and run `pip install -r requirements.txt` first.
name: mcp-server
description: App Mesh MCP Server (Streamable HTTP, Dex protected resource)
command: python3 appmesh_server.py
working_dir: /opt/appmesh/sdk/mcp_server
shell: false
permission: 11
env:
  # App Mesh REST endpoint the MCP server forwards tool calls to.
  APPMESH_URL: https://127.0.0.1:6060
  # Verify the daemon's TLS cert; set the CA path, or "false" for loopback dev.
  APPMESH_CA: /opt/appmesh/ssl/ca.pem
  # Canonical issuer is security identity; access URL is this process's network route.
  APPMESH_DEX_ISSUER: https://your-host/dex
  APPMESH_DEX_ACCESS_URL: http://127.0.0.1:6062/dex
  APPMESH_DEX_TLS_VERIFY: "true"
  APPMESH_DEX_AUDIENCE: appmesh-api
  # MCP listener.
  APPMESH_MCP_HOST: 0.0.0.0
  APPMESH_MCP_PORT: "6071"
  # Public base URL advertised in OAuth metadata (what clients connect to).
  APPMESH_MCP_PUBLIC_URL: https://your-host:6071
  # Enable HTTPS for the MCP endpoint (recommended for remote clients).
  APPMESH_MCP_TLS_CERT: /opt/appmesh/ssl/server.pem
  APPMESH_MCP_TLS_KEY: /opt/appmesh/ssl/server-key.pem
behavior:
  # Keep the long-running MCP server alive.
  exit: keepalive
# Liveness probe: RFC 9728 protected-resource metadata is always served.
# FastMCP serves MCP at /mcp, so the metadata route carries that resource-path
# suffix (/.well-known/oauth-protected-resource/mcp, RFC 9728 section 3.1);
# the bare path without the suffix is not registered. Verifies TLS against the
# App Mesh CA (matches APPMESH_CA above).
health_check_cmd: curl -sf --cacert /opt/appmesh/ssl/ca.pem https://127.0.0.1:6071/.well-known/oauth-protected-resource/mcp -o /dev/null
