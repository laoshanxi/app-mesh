name: "ci-test"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-test.yml
      - "script/**"
      - "src/sdk/**"
      - "src/cli/**"
  workflow_run:
    workflows: ["release-linux"]
    types: [completed]

env:
  APPMESH_VERSION: "2.2.1"

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  ci-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Configure host for daemon coredumps
        run: |
          # Kernel writes core files via the HOST's core_pattern even for containerized processes.
          # Stop the interceptors that pipe cores into apport/systemd-coredump (where the test
          # script in the container cannot reach them), then point cores at a bind-mounted dir.
          sudo systemctl stop apport.service 2>/dev/null || true
          sudo systemctl mask apport.service 2>/dev/null || true
          sudo systemctl stop systemd-coredump.socket 2>/dev/null || true
          sudo systemctl mask systemd-coredump.socket 2>/dev/null || true
          sudo mkdir -p /tmp/host-cores
          sudo chmod 1777 /tmp/host-cores
          sudo sh -c 'echo "/tmp/host-cores/core.%e.%p.%t" > /proc/sys/kernel/core_pattern'
          sudo sysctl -w fs.suid_dumpable=2 || true
          sudo sysctl -w kernel.core_uses_pid=1 || true
          echo "host core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          echo "host suid_dumpable: $(cat /proc/sys/fs/suid_dumpable)"
          # Fail loud if an interceptor reinstalled itself
          test "$(cat /proc/sys/kernel/core_pattern)" = "/tmp/host-cores/core.%e.%p.%t"

      - name: test ubuntu:22
        env:
          OS_TAG: ubuntu22
        run: |
          docker run --rm -e OS_TAG \
            -v ${{ github.workspace }}:/work \
            -v /tmp/host-cores:/cores \
            --ulimit core=-1 \
            --cap-add SYS_PTRACE \
            --entrypoint=bash \
            ubuntu:22.04 \
            -c '
            # Tail server.log only on non-zero exit, for failed-run diagnostics.
            trap '"'"'rc=$?; [ $rc -ne 0 ] && { echo "===== EXIT TRAP (rc=$rc): server.log tail ====="; tail -200 /opt/appmesh/work/server.log 2>&1 || true; echo "===== END server.log tail ====="; }'"'"' EXIT

            apt update
            apt install -y wget iputils-ping gdb curl python3 python3-pip
            wget --quiet --no-check-certificate https://github.com/laoshanxi/app-mesh/releases/download/${{ env.APPMESH_VERSION }}/appmesh_2.2.1_gcc_11_glibc_2.35_x86_64.deb
            apt install -y ./appmesh_*.deb

            ulimit -c unlimited

            # Dex-only authentication bootstrap for CI:
            # 1) precompute the machine-client Principal and seed authorization.yaml
            #    before the first start (Dex derives the client_credentials subject
            #    deterministically from the client id: base64url of protobuf
            #    field 1 = the id, so no running Dex is needed here);
            # 2) once the daemon is up, exchange the launcher-generated
            #    appmesh-automation secret for a client_credentials token.
            DEX_ISSUER="http://127.0.0.1:6062/dex"
            AUTOMATION_SUB=$(python3 -c "import base64; cid=b\"appmesh-automation\"; print(base64.urlsafe_b64encode(bytes([0x0A,len(cid)])+cid).decode().rstrip(\"=\"))")
            PRINCIPAL_ID="oidc:$(DEX_ISSUER="$DEX_ISSUER" AUTOMATION_SUB="$AUTOMATION_SUB" python3 -c "import hashlib,os; print(hashlib.sha256(os.environ[\"DEX_ISSUER\"].encode()+b\"\x00\"+os.environ[\"AUTOMATION_SUB\"].encode()).hexdigest())")"
            install -d -m 700 /opt/appmesh/work/config
            SEED=/opt/appmesh/work/config/authorization.yaml
            {
                sed -n "1,/^  principals:$/p" /opt/appmesh/config/authorization.yaml
                printf "    %s:\n" "$PRINCIPAL_ID"
                printf "      kind: service\n      issuer: %s\n      subject: %s\n      status: active\n      execution_user: \"\"\n      roles: [appmesh-admin]\n" "$DEX_ISSUER" "$AUTOMATION_SUB"
                sed -n "/^  principals:$/,\$p" /opt/appmesh/config/authorization.yaml | tail -n +2
            } > "$SEED"
            chmod 600 "$SEED"
            echo "seeded authorization principal $PRINCIPAL_ID"

            # start appmesh
            /opt/appmesh/script/appmesh.initd.sh start
            sleep 5

            CRED=/opt/appmesh/work/auth/secrets/automation-client
            CLIENT_ID=$(sed -n "s/^client_id=//p" "$CRED")
            CLIENT_SECRET=$(sed -n "s/^secret=//p" "$CRED")
            TOKEN=""
            for _ in $(seq 1 15); do
                TOKEN=$(curl -sf -X POST "$DEX_ISSUER/token" \
                    -d grant_type=client_credentials \
                    -d client_id="$CLIENT_ID" \
                    -d client_secret="$CLIENT_SECRET" \
                    --data-urlencode "scope=audience:server:client_id:appmesh-api" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin)[\"access_token\"])") && break
                sleep 2
            done
            [ -n "$TOKEN" ] || { echo "failed to obtain the client_credentials token"; exit 1; }
            export APPMESH_BEARER_TOKEN="$TOKEN"
            export APPMESH_TEST_ACCESS_TOKEN="$TOKEN"
            appm ls && appm resource
            appm log -L DEBUG || true

            python3 -m pip install --upgrade appmesh pyotp
            bash /work/script/run_python_test_with_debug.sh \
              /work/src/sdk/python/test/integration/test_client.py \
              /work/src/sdk/python/test/test_workflow_engine.py \
              /work/src/sdk/python/sample.py

            # test appmesh golang sdk
            bash /work/script/bootstrap/install_golang.sh
            cd /work/src/sdk/go
            /usr/local/go/bin/go test -v || {
                bash /work/script/run_python_test_with_debug.sh --dump-only "go test failed"
                exit 1
            }

            # test appmesh rust cli + sdk (cli_* cases need an interactive
            # `appm logon` session, which a client_credentials token cannot provide)
            bash /work/script/bootstrap/install_rust.sh
            cd /work/src/cli
            CARGO_TARGET_DIR=/tmp/cargo-target-ubuntu22 cargo test --test remote_test -- --ignored --test-threads=1 --skip cli_
            '

      - name: test ubuntu:24
