            CLIENT_ID=$(sed -n "s/^client_id=//p" "$CRED")
            CLIENT_SECRET=$(sed -n "s/^secret=//p" "$CRED")
            TOKEN=""
            for _ in $(seq 1 15); do
                TOKEN=$(curl -sf -X POST "$DEX_ISSUER/token" \
                    -d grant_type=client_credentials \
                    -d client_id="$CLIENT_ID" \
                    -d client_secret="$CLIENT_SECRET" \
                    --data-urlencode "scope=audience:server:client_id:appmesh-api" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin)[\"access_token\"])") && break
                sleep 2
            done
            [ -n "$TOKEN" ] || { echo "failed to obtain the client_credentials token"; exit 1; }
            export APPMESH_BEARER_TOKEN="$TOKEN"
            export APPMESH_TEST_ACCESS_TOKEN="$TOKEN"
            appm ls && appm resource
            appm log -L DEBUG || true

            # test appmesh python sdk FIRST — Python wrapper captures full daemon
            # diagnostics on crash (backtrace / dmesg / server.log).
            python3 -m pip install --break-system-packages --upgrade appmesh pyotp
            bash /work/script/run_python_test_with_debug.sh \
              /work/src/sdk/python/test/integration/test_client.py \
              /work/src/sdk/python/test/test_workflow_engine.py \
              /work/src/sdk/python/sample.py

            # test appmesh golang sdk
            bash /work/script/bootstrap/install_golang.sh
            cd /work/src/sdk/go
            /usr/local/go/bin/go test -v || {
                bash /work/script/run_python_test_with_debug.sh --dump-only "go test failed"
                exit 1
            }

            # test appmesh rust cli + sdk (cli_* cases need an interactive
            # `appm logon` session, which a client_credentials token cannot provide)
            bash /work/script/bootstrap/install_rust.sh
            cd /work/src/cli
            CARGO_TARGET_DIR=/tmp/cargo-target-ubuntu24 cargo test --test remote_test -- --ignored --test-threads=1 --skip cli_
            '

