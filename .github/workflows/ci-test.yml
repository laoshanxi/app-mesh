            apt install -y ./appmesh_*.deb

            ulimit -c unlimited

            # Dex-only authentication bootstrap for CI:
            # 1) precompute the machine-client Principal and seed authorization.yaml
            #    before the first start (Dex derives the client_credentials subject
            #    deterministically from the client id: base64url of protobuf
            #    field 1 = the id, so no running Dex is needed here);
            # 2) once the daemon is up, exchange the launcher-generated
            #    appmesh-automation secret for a client_credentials token.
