name: "release-windows"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-windows.yml"
      - "src/**"
      - "script/**"
      - "test/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_LICENSES/**"

permissions: read-all

env:
  APPMESH_VERSION: "3.0.0"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set PowerShell Execution Policy
        shell: pwsh
        run: Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser

      - name: Setup Build Environment
        shell: pwsh
        run: .\script\bootstrap\install_build_deps.ps1

      - name: Build binaries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --parallel --config Release --target agent
          cmake --build build --parallel --config Release --target appm
          cmake --build build --parallel --config Release --target appmesh
          cmake --build build --parallel --config Release --target install

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build package
        shell: pwsh
        run: .\script\pack\build_package.ps1

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ github.sha }}
          path: build/appmesh_*.exe

  test:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-${{ github.sha }}

      - run: choco install 7zip -y

      - name: Run tests
        shell: pwsh
        run: |
          # Install package (extract the NSIS payload; the service is set up below
          # exactly like the installer's own section does).
          $installer = Get-ChildItem -Filter "appmesh_*_windows_x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "installer exe not found" }
          7z x $installer.FullName -oC:\local\appmesh | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed" }
          ls "C:\local\appmesh"

          # Windows ships the bundled System App with its native PowerShell
          # launcher and executable runtime.
          foreach ($required in @("apps\auth-service.yaml", "config\auth-stack.yaml", "config\dex.yaml", "config\oidc.yaml", "config\authorization.yaml", "script\appmesh-auth.ps1", "script\setup.ps1", "bin\dex.exe", "bin\password-hash.exe", "bin\appmesh.exe", "bin\appm.exe", "bin\agent.exe", "bin\nssm.exe", "bin\wf-engine.exe", "bin\openssl.exe")) {
            if (-not (Test-Path (Join-Path "C:\local\appmesh" $required))) { throw "missing package file: $required" }
          }
          if (-not (Select-String -Path "C:\local\appmesh\apps\pyrun.yaml" -Pattern "python\.exe" -Quiet)) { throw "apps were not patched from python3 to python.exe" }
          if (-not (Select-String -Path "C:\local\appmesh\apps\auth-service.yaml" -Pattern "appmesh-auth\.ps1" -Quiet)) { throw "authentication service was not patched to the Windows launcher" }

          # dex is a CGO-free (memory storage) build; it must run without any
          # runtime DLL beside it, exactly like an installed machine.
          & "C:\local\appmesh\bin\dex.exe" version
          if ($LASTEXITCODE -ne 0) { throw "dex.exe failed to run (exit $LASTEXITCODE)" }

          # Per-node TLS material (normally produced by the NSIS install section).
          & "C:\local\appmesh\ssl\generate_ssl_cert.ps1"
          if ($LASTEXITCODE -ne 0) { throw "SSL certificate generation failed" }

          # Surface the one-shot auth bootstrap result directly in the step log;
          # the service action repeats the same steps idempotently on start.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\local\appmesh\script\appmesh-auth.ps1" bootstrap
          if ($LASTEXITCODE -ne 0) { throw "auth bootstrap failed (exit $LASTEXITCODE)" }

          # Show exactly the OIDC configuration the engine will resolve.
          foreach ($cfg in @("config\oidc.yaml", "work\config\oidc.yaml")) {
            $cfgPath = Join-Path "C:\local\appmesh" $cfg
            if (Test-Path $cfgPath) {
              Write-Host "===== $cfg (first 12 lines) ====="
              Get-Content $cfgPath -TotalCount 12 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "===== ${cfg}: absent ====="
            }
          }

          # Register and start the service.
          & "C:\local\appmesh\bin\nssm.exe" install AppMeshService "C:\local\appmesh\bin\appmesh.exe"
          if ($LASTEXITCODE -ne 0) { throw "failed to install AppMeshService" }
          & "C:\local\appmesh\bin\nssm.exe" set AppMeshService AppDirectory "C:\local\appmesh"
          if ($LASTEXITCODE -ne 0) { throw "failed to configure AppMeshService application directory" }
          & "C:\local\appmesh\bin\nssm.exe" set AppMeshService Start SERVICE_AUTO_START
          if ($LASTEXITCODE -ne 0) { throw "failed to configure AppMeshService start mode" }
          # Match installer.nsi: capture service output and throttle the crash-restart loop.
          & "C:\local\appmesh\bin\nssm.exe" set AppMeshService AppStdout "C:\local\appmesh\install_stdout.log"
          & "C:\local\appmesh\bin\nssm.exe" set AppMeshService AppStderr "C:\local\appmesh\install_stderr.log"
          & "C:\local\appmesh\bin\nssm.exe" set AppMeshService AppExit Default Restart
          & "C:\local\appmesh\bin\nssm.exe" set AppMeshService AppRestartDelay 5000
          & "C:\local\appmesh\bin\nssm.exe" start AppMeshService
          if ($LASTEXITCODE -ne 0) { throw "failed to start AppMeshService" }

          # The unauthenticated RFC 9728 metadata must name the packaged issuer.
          function Get-EngineJson([string]$Path) {
            # The engine opens the REST listener only after startup-app readiness
            # and OIDC/JWKS prewarm; each phase may take up to 120 s.
            for ($i = 0; $i -lt 60; $i++) {
              $raw = curl.exe -sk --fail --max-time 5 "https://127.0.0.1:6060$Path"
              if ($LASTEXITCODE -eq 0 -and $raw) { return ($raw | ConvertFrom-Json) }
              Start-Sleep -Seconds 2
            }
            Write-Host ("nssm status: " + ((& "C:\local\appmesh\bin\nssm.exe" status AppMeshService 2>&1) -join ""))
            foreach ($log in @("install_stderr.log", "install_stdout.log", "work\server.log")) {
              $p = Join-Path "C:\local\appmesh" $log
              if (Test-Path $p) {
                Write-Host "===== $log (tail 60) ====="
                Get-Content $p -Tail 60 | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host "===== ${log}: missing ====="
              }
            }
            $serverLog = "C:\local\appmesh\work\server.log"
            if (Test-Path $serverLog) {
              Write-Host "===== work\server.log (head 40) ====="
              Get-Content $serverLog -TotalCount 40 | ForEach-Object { Write-Host $_ }
            }
            $stdoutDir = "C:\local\appmesh\work\stdout"
            if (Test-Path $stdoutDir) {
              Get-ChildItem $stdoutDir -File | ForEach-Object {
                Write-Host "===== stdout/$($_.Name) (tail 60) ====="
                Get-Content $_.FullName -Tail 60 | ForEach-Object { Write-Host $_ }
              }
            } else {
              Write-Host "===== work\stdout: missing ====="
            }
            throw "Engine did not answer $Path"
          }
          $metadata = Get-EngineJson "/.well-known/oauth-protected-resource"
          $status = (& "C:\local\appmesh\bin\nssm.exe" status AppMeshService) -join ""
          if ($status -notmatch "SERVICE_RUNNING") { throw "AppMeshService is not running: $status" }
          if ($metadata.authorization_servers[0] -ne "http://127.0.0.1:6062/auth") {
            throw "unexpected default issuer: $($metadata.authorization_servers[0])"
          }

          # The bundled service must issue the maintenance token used by package
          # lifecycle commands, and the Engine must accept it.
          $token = ""
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            $token = (& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\local\appmesh\script\appmesh-auth.ps1" automation-token) -join ""
            if ($LASTEXITCODE -eq 0 -and $token) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $token) { throw "bundled authentication service did not issue an automation token" }
          $env:APPMESH_BEARER_TOKEN = $token
          & "C:\local\appmesh\bin\appm.exe" ls
          if ($LASTEXITCODE -ne 0) { throw "Engine rejected the bundled authentication token" }
          Remove-Item Env:APPMESH_BEARER_TOKEN
          $token = ""

          # Fail-closed while the engine is up: with no bearer, appm must get 401.
          & "C:\local\appmesh\bin\appm.exe" ls
          if ($LASTEXITCODE -eq 0) { throw "appm ls must require an authenticated session" }

          # Switching to an external issuer remains supported. The engine fails
          # fast when the external issuer is unreachable (by design), so verify
          # the persisted switch instead of a live engine. setup.ps1's reachability
          # gate is satisfied by the still-running local dex JWKS route.
          & "C:\local\appmesh\script\setup.ps1" -Issuer "https://auth.ci.example.internal/oidc" -AccessUrl "http://10.99.0.1:6062/auth" -BrowserEntry "http://127.0.0.1:6062/auth/keys" -TlsVerify false
          if ($LASTEXITCODE -ne 0) { throw "setup.ps1 failed" }
          $override = Get-Content "C:\local\appmesh\work\config\oidc.yaml" -Raw
          if ($override -notmatch "issuer:\s*https://auth\.ci\.example\.internal/oidc") { throw "setup.ps1 did not persist the issuer override" }
          if ($override -notmatch "access_url:\s*http://10\.99\.0\.1:6062/auth") { throw "setup.ps1 did not persist the access URL override" }
          if ($override -notmatch "tls_verify:\s*false") { throw "setup.ps1 did not persist the TLS override" }
          $envExtra = (& "C:\local\appmesh\bin\nssm.exe" get AppMeshService AppEnvironmentExtra) -join ""
          if ($envExtra -notmatch "APPMESH_AUTH_MODE=external") { throw "setup.ps1 did not set external auth mode on the service" }
          if (-not (Select-String -Path "C:\local\appmesh\apps\auth-service.yaml" -Pattern "^status:\s*0\s*$" -Quiet)) { throw "the bundled auth app was not disabled" }

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "appmesh_*.exe"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.1 # TODO: Renovate will pin to SHA

      - name: Cosign keyless sign release artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Filter "appmesh_*.exe" | ForEach-Object {
            cosign sign-blob --yes `
              --bundle "$($_.Name).bundle" `
              $_.Name
            if ($LASTEXITCODE -ne 0) { throw "cosign failed for $($_.Name)" }
          }

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "OpenID Connect (OIDC)"
          tag_name: ${{ env.APPMESH_VERSION }}
          fail_on_unmatched_files: false
          token: ${{ secrets.PUBLISH_RELEASE }}
          files: |
            appmesh_*.exe
            appmesh_*.exe.bundle
