name: "release-sdk-java"

# https://docs.github.com/en/actions/publishing-packages/publishing-java-packages-with-maven

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/sdk/java/**"
      - .github/workflows/release-sdk-java.yml

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Setup Maven settings.xml
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${GITHUB_ACTOR}</username><password>${GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml

      - uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Publish package
        working-directory: "src/sdk/java/"
        # Re-runs (e.g. after a history rewrite) must not fail on the
        # already-deployed artifact; deploying is idempotent here.
        run: |
          VERSION=$(mvn --batch-mode -q help:evaluate -Dexpression=project.version -DforceEval | tail -n 1)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"             "https://maven.pkg.github.com/laoshanxi/app-mesh/laoshanxi/appmesh/$VERSION/appmesh-$VERSION.pom")
          if [ "$STATUS" = "200" ]; then
            echo "laoshanxi:appmesh:$VERSION already deployed, skipping"
          else
            mvn --batch-mode deploy -DskipTests
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
