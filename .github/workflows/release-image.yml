name: "release-image"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - script/pack/docker-entrypoint.sh
      - .github/workflows/release-image.yml
  workflow_run:
    workflows: ["release-linux"]
    types:
      - completed
    branches:
      - main

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: laoshanxi/appmesh
  APPMESH_VERSION: "3.0.0"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build Platform Image
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Github code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}

      - name: Build and Push Platform Image
        id: build-platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: appmesh
          no-cache: true
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and Push LLM Platform Image
        id: build-platform-llm
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: llm_agent
          no-cache: true
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-llm-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: ${{ steps.meta.outputs.labels }}

  merge-and-push:
    name: Merge and Release Multi-arch Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Multi-arch Manifests
        run: |
          for tag in ${{ env.APPMESH_VERSION }} latest; do
            docker buildx imagetools create -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${tag} \
              ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-amd64 \
              ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-arm64
          done
          for tag in ${{ env.APPMESH_VERSION }}-llm llm; do
            docker buildx imagetools create -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${tag} \
              ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-llm-amd64 \
              ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-llm-arm64
          done

      - name: Cleanup Platform Tags
        run: |
          set -e
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"username": "'${{ secrets.DOCKERHUB_USERNAME }}'", "password": "'${{ secrets.DOCKERHUB_TOKEN }}'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          for tag in \
            ${{ env.APPMESH_VERSION }}-amd64 \
            ${{ env.APPMESH_VERSION }}-arm64 \
            ${{ env.APPMESH_VERSION }}-llm-amd64 \
            ${{ env.APPMESH_VERSION }}-llm-arm64; do
            IMAGE_URL="https://hub.docker.com/v2/repositories/${{ env.DOCKER_IMAGE }}/tags/${tag}/"
            curl -X DELETE -H "Authorization: Bearer ${TOKEN}" ${IMAGE_URL} || echo "Failed to delete ${tag}"
          done

      - name: Generate Docker Image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}
          format: spdx-json
          output-file: appmesh-image-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: true

      - name: Verify Image
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}
          shell: bash
          run: |
            timeout 60s /opt/appmesh/script/docker-entrypoint.sh &
            sleep 5
            # Dex-only image: every request needs a bearer. Use the launcher as
            # the single owner of machine-credential location and token exchange.
            TOKEN=""
            for _ in $(seq 1 10); do
              TOKEN=$(/opt/appmesh/script/appmesh-auth.sh automation-token) && break
              sleep 2
            done
            [ -n "$TOKEN" ] || { echo "failed to obtain the client_credentials token"; exit 1; }
            APPMESH_BEARER_TOKEN="$TOKEN" appm ls
            # Password grant through bundled Dex verifies bootstrap credentials
            # and the pre-seeded viewer RBAC.
            GUEST_PW=$(awk -F= '$1=="password"{print $2}' /opt/appmesh/work/auth/secrets/initial-viewer-credentials)
            GUEST_JWT=$(curl -s -X POST \
              -d "grant_type=password&client_id=appmesh-cli&username=guest@appmesh.local&password=${GUEST_PW}&scope=openid%20audience:server:client_id:appmesh-api" \
              http://127.0.0.1:6062/auth/token |
              sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([A-Za-z0-9._~-]*\)".*/\1/p')
            [ -n "$GUEST_JWT" ] || { echo "failed to obtain the password-grant token"; exit 1; }
            APPMESH_BEARER_TOKEN="$GUEST_JWT" appm ls >/dev/null

      - name: Verify LLM Image
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.APPMESH_VERSION }}-llm
          shell: bash
          run: |
            python3 -c "import appmesh, claude_agent_sdk"
