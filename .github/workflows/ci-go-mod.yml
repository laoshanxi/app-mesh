name: "ci-go-mod"

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tidy:
    name: Go modules are tidy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Verify go.mod and go.sum are tidy
        run: |
          # src/apps/workflow is a separate module that replaces the root one, so a
          # dependency bump in the root go.mod leaves its indirect pins stale
          # until it is tidied too. Both must be tidy, or a -mod=readonly build
          # refuses the module graph.
          for dir in . src/apps/workflow; do
            echo "::group::go mod tidy in $dir"
            (cd "$dir" && go mod tidy)
            echo "::endgroup::"
          done

          PATHS="go.mod go.sum src/apps/workflow/go.mod src/apps/workflow/go.sum"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            git --no-pager diff -- $PATHS
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in the module that changed and commit the result."
            exit 1
          fi
