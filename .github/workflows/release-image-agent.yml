name: "release-image-agent"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.container_agent
      - .github/workflows/release-image-agent.yml
  workflow_run:
    workflows: ["release-sdk-python"]
    types:
      - completed

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: laoshanxi/appmesh
  IMAGE_TAG: container_agent
  APPMESH_VERSION: "3.0.0"

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  build:
    name: Build Platform Image
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      # https://github.com/docker/login-action
      - name: Login to DockerHub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          platforms: ${{ matrix.platform }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and Push Platform Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: https://github.com/laoshanxi/app-mesh.git#main:docker
          file: Dockerfile.container_agent
          no-cache: true
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: test
        run: |
          DEB_ARCH=$(arch)
          IMG_NAME="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          wget --quiet --no-check-certificate "https://github.com/laoshanxi/app-mesh/releases/download/${{ env.APPMESH_VERSION }}/appmesh_${{ env.APPMESH_VERSION }}_gcc_13_glibc_2.39_${DEB_ARCH}.deb"
          sudo apt update
          sudo apt install -y ./appmesh_*.deb
          sudo /opt/appmesh/script/appmesh.initd.sh start
          sleep 3
          # The agent needs app-run-async and app-delete, which the automation
          # Principal lacks. The CLI logon does the one-time first-admin
          # enrollment; the password grant then yields an admin bearer.
          ADMIN_PW=$(sudo /opt/appmesh/script/appmesh-auth.sh print-initial-password)
          printf '%s\n' "$ADMIN_PW" | sudo script -qc "appm logon -u admin@appmesh.local" /dev/null >/dev/null
          ADMIN_JWT=""
          for _ in $(seq 1 10); do
            ADMIN_JWT=$(curl -s -X POST \
              -d "grant_type=password&client_id=appmesh-cli&username=admin@appmesh.local&password=${ADMIN_PW}&scope=openid%20audience:server:client_id:appmesh-api" \
              http://127.0.0.1:6062/auth/token |
              sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([A-Za-z0-9._~-]*\)".*/\1/p')
            [ -n "$ADMIN_JWT" ] && break
            sleep 2
          done
          [ -n "$ADMIN_JWT" ] || { echo "failed to obtain the admin password-grant token"; exit 1; }
          # container_monitor.py runs on the host, so the host needs both modules
          sudo python3 -m pip install appmesh docker --break-system-packages
          sudo rm -f /tmp/container.id
          sudo docker run --net=host --cidfile=/tmp/container.id -v /tmp/container.id:/tmp/container.id \
            -e APPMESH_BEARER_TOKEN="${ADMIN_JWT}" "${IMG_NAME}" ps -ef
          # container_monitor.py on the host must delete both Apps after exit
          for _ in $(seq 1 10); do
            sudo APPMESH_BEARER_TOKEN="${ADMIN_JWT}" appm ls | grep -qF "$(cat /tmp/container.id)" || exit 0
            sleep 2
          done
          echo "the monitor App cleanup failed"; exit 1

  merge-and-push:
    name: Merge and Push Multi-arch Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Multi-arch Manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}-amd64 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}-arm64

      - name: Cleanup Platform Tags
        run: |
          set -e
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"username": "'${{ secrets.DOCKERHUB_USERNAME }}'", "password": "'${{ secrets.DOCKERHUB_TOKEN }}'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          for arch in amd64 arm64; do
            IMAGE_URL="https://hub.docker.com/v2/repositories/${{ env.DOCKER_IMAGE }}/tags/${{ env.IMAGE_TAG }}-${arch}/"
            curl -X DELETE -H "Authorization: Bearer ${TOKEN}" ${IMAGE_URL} || echo "Failed to delete ${arch} tag"
          done
