name: "release-macos"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-macos.yml"
      - "src/**"
      - "script/**"
      - "test/**"
      - "CMakeLists.txt"
      - "cmake/**"

permissions: read-all

env:
  APPMESH_VERSION: "3.0.0"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Homebrew and Install Dependencies
        run: |
          echo "Updating Homebrew..."
          brew update

          echo "Verifying installed packages..."
          brew list

      - name: Setup Build Environment
        run: |
          bash script/bootstrap/install_build_deps.mac.sh

      - name: Build project
        if: always()
        run: |
          echo "Creating build directory..."
          mkdir -p build && cd build

          echo "Running CMake configuration..."
          cmake .. -DBoost_ROOT="$(brew --prefix boost)"

          echo "Building the project..."
          make -j"$(sysctl -n hw.ncpu)"
          make pack

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.os }}-${{ github.sha }}
          path: build/appmesh_*.pkg

  test:
    needs: build
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "stable"

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.os }}-${{ github.sha }}

      - name: Run tests
        run: |
          set -x
          echo "Testing the project..."
          # Install App Mesh
          os_ver="${{ matrix.os }}"
          os_ver="${os_ver#*-}"
          pkg_file=$(ls appmesh_*_macos_${os_ver}_*.pkg | head -n1)
          if [ -z "$pkg_file" ]; then
            echo "No matching pkg file found!" && ls -l && exit 1
          fi
          if ! sudo installer -pkg "$pkg_file" -target / -verbose; then
            echo "Installer failed! Printing debug info:"
            ls -l
            cat /var/log/install.log | tail -n 100
            exit 1
          fi
          cat /var/log/install.log | tail -n 100

          # Enable core dumps so any crash leaves an analyzable artifact (initd.sh also sets ulimit -c).
          # macOS only honors /cores when sysctl kern.coredump=1 and the directory is writable.
          sudo sysctl -w kern.coredump=1 || true
          sudo mkdir -p /cores && sudo chmod 1777 /cores
          ulimit -c unlimited
          ulimit -a

          sudo cp -a /opt/appmesh/bin/appmesh /cores/appmesh.macos.bin || true
          sudo chmod a+r /cores/appmesh.macos.bin 2>/dev/null || true

          # Start App Mesh — Dex-only authentication bootstrap first (same
          # flow as ci-test):
          # 1) precompute the machine-client Principal and seed
          #    authorization.yaml before the first start (Dex derives the
          #    client_credentials subject deterministically from the client id:
          #    base64url of protobuf field 1 = the id, so no running Dex is
          #    needed here);
          # 2) once the daemon is up, exchange the launcher-generated
          #    appmesh-automation secret for a client_credentials token.
          appm -V || true
          DEX_ISSUER="http://127.0.0.1:6062/auth"
          AUTOMATION_SUB=$(python3 -c 'import base64; cid=b"appmesh-automation"; print(base64.urlsafe_b64encode(bytes([0x0A,len(cid)])+cid).decode().rstrip("="))')
          PRINCIPAL_ID="oidc:$(DEX_ISSUER="$DEX_ISSUER" AUTOMATION_SUB="$AUTOMATION_SUB" python3 -c 'import hashlib,os; print(hashlib.sha256(os.environ["DEX_ISSUER"].encode()+b"\x00"+os.environ["AUTOMATION_SUB"].encode()).hexdigest())')"
          sudo install -d -m 700 /opt/appmesh/work/config
          sudo DEX_ISSUER="$DEX_ISSUER" AUTOMATION_SUB="$AUTOMATION_SUB" PRINCIPAL_ID="$PRINCIPAL_ID" bash -c '
              SEED=/opt/appmesh/work/config/authorization.yaml
              {
                  sed -n "1,/^  principals:$/p" /opt/appmesh/config/authorization.yaml
                  printf "    %s:\n" "$PRINCIPAL_ID"
                  printf "      kind: service\n      issuer: %s\n      subject: %s\n      status: active\n      execution_user: \"\"\n      roles: [appmesh-ci]\n" "$DEX_ISSUER" "$AUTOMATION_SUB"
                  sed -n "/^  principals:$/,/^  roles:$/p" /opt/appmesh/config/authorization.yaml | tail -n +2
                  printf "    appmesh-ci:\n"
                  sed -n "/^    appmesh-admin:$/,/^    appmesh-viewer:$/p" /opt/appmesh/config/authorization.yaml | sed "1d;\$d"
                  sed -n "/^  roles:$/,\$p" /opt/appmesh/config/authorization.yaml | tail -n +2
              } > "$SEED"
              chmod 600 "$SEED"
          '
          echo "seeded authorization principal $PRINCIPAL_ID"

          sudo bash /opt/appmesh/script/appmesh.initd.sh start

          # Check
          sudo otool /opt/appmesh/bin/appmesh -L

          # hostname resolve need some time
          sleep 10

          # Test
          tail /opt/appmesh/work/server.log
          tail /opt/appmesh/work/stdout/appmesh.agent.out
          # sudo lldb -p $(cat /opt/appmesh/appmesh.pid) -o "thread backtrace all" -o "quit" || true

          TOKEN=""
          for _ in $(seq 1 15); do
              TOKEN=$(sudo /opt/appmesh/script/appmesh-auth.sh automation-token) && break
              sleep 2
          done
          [ -n "$TOKEN" ] || { echo "failed to obtain the client_credentials token"; exit 1; }
          export APPMESH_BEARER_TOKEN="$TOKEN"
          export APPMESH_TEST_ACCESS_TOKEN="$TOKEN"
          appm ls && appm resource

          # Force daemon LogLevel=DEBUG at runtime via REST API (most reliable).
          appm log -L DEBUG || true

          # test appmesh python sdk
          python3 -m pip install --break-system-packages --upgrade appmesh pyotp
          # Run both scripts under the same wrapper so a sample.py crash also dumps
          # daemon backtrace / wrapper log / server.log via dump_failure_context.
          bash script/run_python_test_with_debug.sh \
            src/sdk/python/test/integration/test_client.py \
            src/sdk/python/sample.py

          cd src/sdk/go
          go test -v || {
            # Use the unified diagnostic wrapper so go-test failures show full
            # backtrace / dmesg / server.log just like python-test failures do.
            bash "${GITHUB_WORKSPACE}/script/run_python_test_with_debug.sh" --dump-only "go test failed (macOS)"
            exit 1
          }

  publish:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download macos-14 packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-14-${{ github.sha }}

      - name: Download macos-15 packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-15-${{ github.sha }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "appmesh_*.pkg"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.1 # TODO: Renovate will pin to SHA

      - name: Cosign keyless sign release artifacts
        run: |
          set -e
          shopt -s nullglob
          for f in appmesh_*.pkg; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "$f"
          done

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "OpenID Connect (OIDC)"
          tag_name: ${{ env.APPMESH_VERSION }}
          fail_on_unmatched_files: false
          token: ${{ secrets.PUBLISH_RELEASE }}
          files: |
            appmesh_*.pkg
            appmesh_*.pkg.bundle
