# App Mesh cluster with the bundled authentication service.
#
# appmesh_master owns the authentication service (Dex) and the SQLite identity
# state. Slaves join as followers. A follower runs no Dex, creates no
# credentials, and verifies tokens against the master's issuer. The issuer is
# the compose-network route to the master's Dex listener. Keep it as one
# identical string on every node and client.
#
# In-network usage (the issuer hostname resolves only inside the network):
#   appm -H wss://appmesh_master:6058 -F appmesh_slave1 logon --auth-allow-http
#   appm -H wss://appmesh_master:6058 -F appmesh_slave1 view
# The CLI speaks WSS on 6058, not the REST port 6060 (the Go agent). The master's
# TLS material lives in the appmesh_tls volume: the CA survives container
# re-creation, and the MCP service mounts it read-only to verify the engine.
# Host ports use the daemon defaults:
#   trust the CA once: docker cp appmesh_master:/opt/appmesh/ssl/ca.pem ./master-ca.pem
#   REST/SDK clients: https://127.0.0.1:6060
#   SDK TCP transport (events, workers): 127.0.0.1:6059
#   CLI and SDK WSS transport: wss://127.0.0.1:6058, e.g.
#     appm -H wss://127.0.0.1:6058 --ca-cert ./master-ca.pem logon \
#       --auth-access-url http://127.0.0.1:6062/auth --auth-allow-http
#   host password/device flows: http://127.0.0.1:6062/auth
#   host MCP clients: http://127.0.0.1:6071/mcp with a password-flow token
# Only the first sign-in (administrator enrollment) must run inside the master
# container: enrollment accepts a loopback client only (see "First sign-in in
# the compose cluster" in docs/source/cluster/ClusterAuthDesign.md).
name: appmesh_cluster
services:
  appmesh_master:
    hostname: appmesh_master
    container_name: appmesh_master
    restart: always
    image: laoshanxi/appmesh
    environment:
      - APPMESH_REST_PrometheusExporterListenPort=6061
      # Cluster authentication owner: runs the bundled Dex.
      - APPMESH_AUTH_ROLE=owner
      # Canonical issuer for the whole cluster, reachable over the compose
      # network. Dex advertises exactly this string in discovery.
      - APPMESH_AUTH_ISSUER=http://appmesh_master:6062/auth
      # Browser entry that fronts the issuer path: the published web UI (443)
      # proxies /auth and the login logo. Advertised in /appmesh/auth/config so
      # WSS/TCP CLI logins hand the browser a reachable, branded address.
      - APPMESH_AUTH_BROWSER_ENTRY=https://127.0.0.1/auth
      # Bind the Dex listener to the protected compose network for followers.
      # Never publish this plaintext listener beyond a protected network.
      - APPMESH_AUTH_LISTEN=0.0.0.0:6062
      # Cluster authorization replication (owner side): publish a random shared
      # token here; followers read it from their read-only mount of the same
      # volume. Setting only this file enables the replication endpoint.
      - APPMESH_AUTH_REPLICATION_TOKEN_FILE=/opt/appmesh/work/auth/replication/replication-token
    volumes:
      # Keep the generated TLS material in a named volume: the CA survives
      # container re-creation, and the MCP service mounts the same volume
      # read-only to verify the engine certificate. Followers keep their own
      # CAs; only the master and the MCP service share this one.
      - appmesh_tls:/opt/appmesh/ssl
      # Replication token shared with the followers (they mount it read-only).
      - appmesh_replication:/opt/appmesh/work/auth/replication
    healthcheck:
      # Gates follower startup on authentication readiness. The daemon's
      # prewarm tolerates a short residual gap, and restart: always recovers.
      test: ["CMD", "/opt/appmesh/script/appmesh-auth.sh", "service-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "443:443" # for appmesh_ui
      - "6060:6060" # Go agent REST API for host REST clients and SDKs
      - "6058:6058" # engine WSS/HTTPS listener: CLI (appm speaks WSS) and SDK WSS clients
      - "6059:6059" # engine TCP API: SDK TCP transport, event subscriptions, workers
      # Issuer route for host-side password/device flows only. The port is
      # plaintext and binds to host loopback. Remove it if unneeded.
      - "127.0.0.1:6062:6062"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  appmesh_ui:
    restart: always
    image: laoshanxi/appmesh-ui
    # network_mode re-attaches the UI to the master's namespace, but a master
    # container restart leaves a running UI in an orphaned namespace (443 dead,
    # nothing re-creates it). restart: true makes compose recreate the UI
    # whenever the master restarts.
    depends_on:
      appmesh_master:
        condition: service_healthy
        restart: true
    # A master restart (docker restart, crash, compose) leaves a running UI in
    # an orphaned network namespace: 443 dies and nothing re-creates the
    # container. Docker does not restart on unhealthy, so the probe stops nginx
    # itself; restart: always then re-creates the container into the live
    # namespace.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:443/health >/dev/null 2>&1 || kill -QUIT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Shares the master's network namespace. The image itself waits for the
    # loopback API upstream before nginx binds 443, and exits after 60s of
    # unreachability so restart: always re-creates the container into the
    # master's live namespace — no healthy-gating is needed here.
    network_mode: "service:appmesh_master"

  appmesh_slave1:
    hostname: appmesh_slave1
    container_name: appmesh_slave1
    restart: always
    image: laoshanxi/appmesh
    mem_limit: 4G
    depends_on:
      appmesh_master:
        condition: service_healthy
    environment:
      - APPMESH_REST_PrometheusExporterListenPort=6061
      # Follower: no local authentication service; same issuer as the master.
      - APPMESH_AUTH_ROLE=follower
      - APPMESH_AUTH_ISSUER=http://appmesh_master:6062/auth
      # Explicit discovery/JWKS route. The packaged default points at loopback,
      # and a follower has no local Dex.
      - APPMESH_AUTH_ACCESS_URL=http://appmesh_master:6062/auth
      # Browser entry from the master: the published web UI (443) fronts the
      # issuer path. The issuer route resolves only inside the network, so a
      # follower cannot derive the entry and carries the owner value.
      - APPMESH_AUTH_BROWSER_ENTRY=https://127.0.0.1/auth
      # Cluster authorization replication (follower side): pull the owner's
      # policy so a follower serves forwarded requests without a manual
      # authorization.yaml copy. The token travels only inside the network.
      - APPMESH_AUTH_REPLICATION_FROM=https://appmesh_master:6058
      - APPMESH_AUTH_REPLICATION_TOKEN_FILE=/opt/appmesh/work/auth/replication/replication-token
      - APPMESH_AUTH_REPLICATION_CA=/mnt/appmesh-tls/ca.pem
    volumes:
      # The shared replication token (read-only). The policy is pulled from the
      # owner's engine listener over TLS, verified with the owner CA.
      - appmesh_replication:/opt/appmesh/work/auth/replication:ro
      - appmesh_tls:/mnt/appmesh-tls:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"


  # LLM node: same daemon with the llm-agent app preinstalled and enabled
  # (laoshanxi/appmesh:llm). Register an API key before first use, e.g. a
  # gateway token: appm -F appmesh_llm add -f llm-agent.yaml \
  #   -z ANTHROPIC_AUTH_TOKEN=<key> -e ANTHROPIC_BASE_URL=<gateway-url> --force
  appmesh_llm:
    hostname: appmesh_llm
    container_name: appmesh_llm
    restart: always
    image: laoshanxi/appmesh:llm
    mem_limit: 4G
    depends_on:
      appmesh_master:
        condition: service_healthy
    environment:
      - APPMESH_REST_PrometheusExporterListenPort=6061
      - APPMESH_AUTH_ROLE=follower
      - APPMESH_AUTH_ISSUER=http://appmesh_master:6062/auth
      - APPMESH_AUTH_ACCESS_URL=http://appmesh_master:6062/auth
      - APPMESH_AUTH_BROWSER_ENTRY=https://127.0.0.1/auth
      - APPMESH_AUTH_REPLICATION_FROM=https://appmesh_master:6058
      - APPMESH_AUTH_REPLICATION_TOKEN_FILE=/opt/appmesh/work/auth/replication/replication-token
      - APPMESH_AUTH_REPLICATION_CA=/mnt/appmesh-tls/ca.pem
    volumes:
      - appmesh_replication:/opt/appmesh/work/auth/replication:ro
      - appmesh_tls:/mnt/appmesh-tls:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  appmesh_slave2:
    hostname: appmesh_slave2
    container_name: appmesh_slave2
    restart: always
    image: laoshanxi/appmesh
    mem_limit: 3G
    depends_on:
      appmesh_master:
        condition: service_healthy
    environment:
      - APPMESH_REST_PrometheusExporterListenPort=6061
      - APPMESH_AUTH_ROLE=follower
      - APPMESH_AUTH_ISSUER=http://appmesh_master:6062/auth
      - APPMESH_AUTH_ACCESS_URL=http://appmesh_master:6062/auth
      # Same browser entry as the master; it fronts the issuer path.
      - APPMESH_AUTH_BROWSER_ENTRY=https://127.0.0.1/auth
      - APPMESH_AUTH_REPLICATION_FROM=https://appmesh_master:6058
      - APPMESH_AUTH_REPLICATION_TOKEN_FILE=/opt/appmesh/work/auth/replication/replication-token
      - APPMESH_AUTH_REPLICATION_CA=/mnt/appmesh-tls/ca.pem
    volumes:
      - appmesh_replication:/opt/appmesh/work/auth/replication:ro
      - appmesh_tls:/mnt/appmesh-tls:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  # MCP server as its own process: the laoshanxi/appmesh:mcp image ships
  # src/integrations/mcp-server with its Python dependencies baked in. It is
  # an OAuth resource server: it validates caller tokens against the master's
  # Dex and forwards the same token to the engine, which enforces RBAC.
  # The OAuth metadata advertises the in-network issuer, which a host client
  # cannot resolve; pass a password-flow token instead
  # (http://127.0.0.1:6062/auth, scope audience:server:client_id:appmesh-api).
  appmesh_mcp:
    hostname: appmesh_mcp
    container_name: appmesh_mcp
    restart: always
    image: laoshanxi/appmesh:mcp
    depends_on:
      appmesh_master:
        condition: service_healthy
    environment:
      # The engine through the Go agent front, verified with the shared CA.
      - APPMESH_URL=https://appmesh_master:6060
      - APPMESH_CA=/mnt/appmesh-tls/ca.pem
      # Same issuer as every node and client; plaintext inside the network.
      - APPMESH_AUTH_ISSUER=http://appmesh_master:6062/auth
      - APPMESH_AUTH_ACCESS_URL=http://appmesh_master:6062/auth
      - APPMESH_AUTH_AUDIENCE=appmesh-api
      # Advertise the published loopback entry to host AI clients.
      - APPMESH_MCP_PUBLIC_URL=http://127.0.0.1:6071
      # No outbound pypi version probe from the MCP container.
      - FASTMCP_CHECK_FOR_UPDATES=off
    volumes:
      # The master's TLS material, read-only (the shared appmesh_tls volume);
      # the server uses ca.pem to verify the engine.
      - appmesh_tls:/mnt/appmesh-tls:ro
    ports:
      # MCP endpoint for host AI clients. Plaintext on host loopback only,
      # the same posture as the Dex port; the bearer token carries the auth.
      - "127.0.0.1:6071:6071"
    healthcheck:
      # RFC 9728 protected-resource metadata is always public.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6071/.well-known/oauth-protected-resource/mcp', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  # The master's TLS material; shared read-only with the MCP service.
  appmesh_tls:
  # Cluster replication token; written by the owner, read-only everywhere else.
  appmesh_replication:
