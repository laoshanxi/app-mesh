name: appmesh_monitor

networks:
  frontend:
  backend:

services:
  appmesh_node:
    hostname: appmesh_node
    restart: always
    image: laoshanxi/appmesh:latest
    environment:
      - APPMESH_REST_PrometheusExporterListenPort=6061
    volumes:
      - /opt/appmesh/work # mount this to enable configuration persist
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "443:443" # for appmesh_ui
      - "6061:6061" # Prometheus Exporter
    networks:
      - frontend

  appmesh-ui:
    restart: always
    image: laoshanxi/appmesh-ui:latest
    depends_on:
      - appmesh_node
    network_mode: "service:appmesh_node" # make sure in same network with appmesh

  loki:
    restart: always
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - backend

  promtail:
    restart: always
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
      - ./promtail.yml:/etc/promtail/config.yml
    volumes_from:
      - appmesh_node
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend
    depends_on:
      - loki

  grafana:
    restart: always
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - frontend

  prometheus:
    restart: always
    image: prom/prometheus:latest
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prom_alert_rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - frontend

  node_exporter: # https://www.cnblogs.com/weifeng1463/p/12828961.html
    hostname: node_exporter
    restart: always
    image: prom/node-exporter:latest
    command: --path.procfs=/host/proc --path.rootfs=/rootfs --path.sysfs=/host/sys --collector.filesystem.ignored-mount-points='^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - frontend

  alertmanager: # https://www.cnblogs.com/aixing/archive/2004/01/13/13327157.html
    hostname: alertmanager
    restart: always
    image: prom/alertmanager:latest
    volumes:
      - ./prom_alertmanager.yml:/etc/alertmanager/config.yml
    command: --config.file=/etc/alertmanager/config.yml
    ports:
      - "9093:9093"
    networks:
      - frontend
    depends_on:
      - prometheus
